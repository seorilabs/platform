name: Publish TypeScript SDK

on:
  push:
    tags:
      - "sdk-ts-v*.*.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-sdk-ts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: SDK 검증 및 npm 공개 발행
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node and npm registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.16.0"
          check-latest: false
          registry-url: https://registry.npmjs.org
          scope: "@seorilabs"

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.3.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test, typecheck, and build
        run: |
          pnpm test
          pnpm typecheck
          pnpm build

      - name: Verify tag and package versions
        run: node scripts/check-sdk-ts-release.mjs "$GITHUB_REF_NAME"

      - name: Resolve approved release base
        id: release-base
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(node scripts/resolve-platform-release-base.mjs)"
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Pack TypeScript SDK
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/$(npm pack ./packages/sdk-ts --pack-destination "$RUNNER_TEMP" --silent)"
          integrity="$(node scripts/typescript-registry-artifact.mjs integrity \
            --artifact "$tarball")"
          {
            echo "tarball=$tarball"
            echo "integrity=$integrity"
          } >> "$GITHUB_OUTPUT"

      - name: Install pinned oasdiff
        run: node scripts/install-oasdiff.mjs "$RUNNER_TEMP/oasdiff"

      - name: Verify common Platform release generator
        shell: bash
        run: |
          set -euo pipefail
          release_tag="v$(tr -d '[:space:]' < sdk-gdscript/VERSION)"
          node scripts/build-platform-release.mjs \
            --release-tag "$release_tag" \
            --source-sha "$GITHUB_SHA" \
            --base-ref "${{ steps.release-base.outputs.sha }}" \
            --typescript-artifact "${{ steps.pack.outputs.tarball }}" \
            --typescript-registry-integrity "${{ steps.pack.outputs.integrity }}" \
            --oasdiff "$RUNNER_TEMP/oasdiff" \
            --output-dir "$RUNNER_TEMP/platform-release-validation"

      - name: Import smoke
        shell: bash
        run: |
          set -euo pipefail
          tarball="${{ steps.pack.outputs.tarball }}"
          smoke_dir="$(mktemp -d "$RUNNER_TEMP/platform-sdk-smoke.XXXXXX")"
          npm install --prefix "$smoke_dir" "$tarball"
          cd "$smoke_dir"
          node --input-type=module -e "import('@seorilabs/platform-sdk').then(({SDK_VERSION}) => { if (!SDK_VERSION) process.exit(1) })"

      - name: Publish public package via trusted publishing
        run: npm publish "${{ steps.pack.outputs.tarball }}"
