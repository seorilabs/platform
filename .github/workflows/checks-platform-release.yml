name: Checks (Platform Release)

on:
  pull_request:
    paths:
      - "packages/sdk-ts/**"
      - "sdk-gdscript/**"
      - "spec/openapi.yaml"
      - "spec/conformance/**"
      - "scripts/*.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/checks-platform-release.yml"
      - ".github/workflows/publish-sdk-gdscript.yml"
      - ".github/workflows/publish-sdk-ts.yml"
      - ".github/platform-release-bootstrap-base.json"
      - ".github/platform-fleet-trusted-release-keys.json"
  push:
    branches: [main]
    paths:
      - "packages/sdk-ts/**"
      - "sdk-gdscript/**"
      - "spec/openapi.yaml"
      - "spec/conformance/**"
      - "scripts/*.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/checks-platform-release.yml"
      - ".github/workflows/publish-sdk-gdscript.yml"
      - ".github/workflows/publish-sdk-ts.yml"
      - ".github/platform-release-bootstrap-base.json"
      - ".github/platform-fleet-trusted-release-keys.json"

permissions:
  contents: read

concurrency:
  group: checks-platform-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Platform release contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.16.0"
          check-latest: false

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.3.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test, typecheck, and build
        run: |
          pnpm test
          pnpm typecheck
          pnpm build

      - name: Install pinned oasdiff
        run: node scripts/install-oasdiff.mjs "$RUNNER_TEMP/oasdiff"

      - name: Resolve approved release base
        id: release-base
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(node scripts/resolve-platform-release-base.mjs)"
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build deterministic release twice
        shell: bash
        run: |
          set -euo pipefail
          typescript_artifact="$RUNNER_TEMP/$(npm pack ./packages/sdk-ts --pack-destination "$RUNNER_TEMP" --silent)"
          typescript_integrity="$(node scripts/typescript-registry-artifact.mjs integrity \
            --artifact "$typescript_artifact")"
          release_tag="v$(tr -d '[:space:]' < sdk-gdscript/VERSION)"
          for output in first second; do
            node scripts/build-platform-release.mjs \
              --release-tag "$release_tag" \
              --source-sha "$GITHUB_SHA" \
              --base-ref "${{ steps.release-base.outputs.sha }}" \
              --typescript-artifact "$typescript_artifact" \
              --typescript-registry-integrity "$typescript_integrity" \
              --oasdiff "$RUNNER_TEMP/oasdiff" \
              --output-dir "$RUNNER_TEMP/platform-release-$output"
          done
          diff -rq \
            "$RUNNER_TEMP/platform-release-first" \
            "$RUNNER_TEMP/platform-release-second"
