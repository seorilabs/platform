# GDScript SDK 검증.
#
# Godot 런타임이 필요하다. 설치·캐시·import를 여기서 다시 짜지 않고 org
# 재사용 워크플로를 호출한다. 러너 아키텍처 분기와 fontconfig 처리까지
# 그쪽이 맡는다.
#
# conformance probe는 TS SDK와 바이트 동일 출력을 강제하고, smoke probe는
# SCRIPT ERROR를 잡는다. Godot은 스크립트 런타임 오류가 나도 실행을
# 계속하므로 exit code만 봐서는 놓친다.
#
# 추적된 CHECKSUM 대조는 지금까지 발행 워크플로에만 있었다. 그래서 드리프트가
# 태그를 밀어야 드러났고, 되돌릴 수 없는 릴리스 태그가 그 자리에서 소모됐다.
# 같은 검사를 PR 단계에서 먼저 돌린다. Godot 런타임이 필요 없어 별도 잡이다.
#
# SDK나 conformance 벡터가 바뀔 때만 돈다. Go 서버만 고친 PR에서는
# 실행되지 않는다.
name: Checks (GDScript SDK)

on:
  pull_request:
    paths:
      - "sdk-gdscript/**"
      - "spec/conformance/**"
      - "scripts/check_sdk_gdscript.sh"
      - "scripts/sdk_gdscript_checksum.sh"
      - ".github/workflows/checks-sdk.yml"
  push:
    branches: [main]
    paths:
      - "sdk-gdscript/**"
      - "spec/conformance/**"
      - "scripts/check_sdk_gdscript.sh"
      - "scripts/sdk_gdscript_checksum.sh"
      - ".github/workflows/checks-sdk.yml"

permissions:
  contents: read

concurrency:
  group: checks-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checksum:
    name: GDScript SDK checksum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify tracked CHECKSUM matches the addon tree
        run: bash scripts/sdk_gdscript_checksum.sh --check

  sdk:
    name: GDScript SDK
    uses: seorilabs/.github/.github/workflows/godot-checks.yml@97e16ce4cbdfb20d6a2a7872782cc34ecef022c3
    with:
      runs_on: ubuntu-latest
      project_dir: sdk-gdscript
      check_command: |
        bash scripts/check_sdk_gdscript.sh
