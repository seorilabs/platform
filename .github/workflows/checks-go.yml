# Go 서버 정적 검사.
#
# Godot은 필요 없다. 이 저장소가 GDScript SDK도 같이 배포하지만 그건
# checks-sdk.yml이 따로 맡는다. 서버만 고친 PR에서 Godot을 내려받으면
# 러너를 낭비한다.
#
# ## ARC로 보내지 않는 이유
#
# race detector가 RPI에서 돌지 않는다. 하드웨어·커널 제약이라 툴체인으로
# 못 넘는다.
#
#   FATAL: ThreadSanitizer: unsupported VMA range
#   FATAL: Found 47 - Supported 48
#
# RPI arm64 커널은 가상 주소가 47비트인데 ThreadSanitizer는 48비트를
# 요구한다. CGO_ENABLED를 켜고 gcc를 설치해도 여기서 막힌다.
#
# -race를 버리는 선택지도 있었지만 원장이 Firestore 트랜잭션과 goroutine을
# 함께 쓰는 자리라 그 검사가 실제로 값을 한다. 짧은 job이므로
# GitHub-hosted로 보낸다.
name: Checks (Go)

on:
  pull_request:
    paths:
      - "server/**"
      - "spec/**"
      - ".github/workflows/checks-go.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - "spec/**"
      - ".github/workflows/checks-go.yml"

permissions:
  contents: read

concurrency:
  group: checks-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # -race는 데이터 경합을 잡는다. 원장이 Firestore 트랜잭션과
      # goroutine을 함께 쓰므로 이게 없으면 경합이 CI를 통과한다.
      #
      # 배포 산출물은 deploy.yml이 CGO_ENABLED=0으로 따로 만든다.
      # 여기서 cgo를 쓰는 것은 검사 전용이고 distroless에 올라가는
      # 정적 바이너리에는 영향이 없다.
      - name: go test
        run: go test -race ./...

      # 버전을 고정한다. latest로 두면 린터 기본값이 바뀌는 날
      # 아무도 건드리지 않은 PR이 빨갛게 된다. v2.12.2에서 0 issues임을
      # 로컬에서 확인했다.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: server
          version: v2.12.2
