# Go 서버 정적 검사.
#
# Godot은 필요 없다. 이 저장소가 GDScript SDK도 같이 배포하지만 그건
# checks-sdk.yml이 따로 맡는다. 서버만 고친 PR에서 Godot을 내려받으면
# 러너를 낭비한다.
#
# ## ARC로 보내지 않는 이유
#
# race detector가 RPI에서 돌지 않는다. 하드웨어·커널 제약이라 툴체인으로
# 못 넘는다.
#
#   FATAL: ThreadSanitizer: unsupported VMA range
#   FATAL: Found 47 - Supported 48
#
# RPI arm64 커널은 가상 주소가 47비트인데 ThreadSanitizer는 48비트를
# 요구한다. CGO_ENABLED를 켜고 gcc를 설치해도 여기서 막힌다.
#
# -race를 버리는 선택지도 있었지만 원장이 Firestore 트랜잭션과 goroutine을
# 함께 쓰는 자리라 그 검사가 실제로 값을 한다. 짧은 job이므로
# GitHub-hosted로 보낸다.
name: Checks (Go)

on:
  pull_request:
    paths:
      - "server/**"
      - "spec/**"
      - "registry/**"
      - "deploy/rpi/**"
      - "scripts/check_deploy_workflow.sh"
      - "scripts/check_spec_routes.sh"
      - ".github/workflows/checks-go.yml"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/presence-edge.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - "spec/**"
      - "registry/**"
      - "deploy/rpi/**"
      - "scripts/check_deploy_workflow.sh"
      - "scripts/check_spec_routes.sh"
      - ".github/workflows/checks-go.yml"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/presence-edge.yml"

permissions:
  contents: read

concurrency:
  group: checks-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # 스펙이 계약의 SoT인데 실제로 갈라져 있었다. 웹훅 경로가 특히
      # 위험하다 — 스펙대로 App Store Connect에 등록하면 404가 나고
      # 환불 알림이 유실된다. 사람 눈에 기대지 않는다.
      - name: 스펙과 라우트 대조
        working-directory: .
        run: bash scripts/check_spec_routes.sh

      - name: production 배포 경계 검증
        working-directory: .
        run: bash scripts/check_deploy_workflow.sh

      # 레지스트리 파일이 부팅 전에 통과해야 하는 검증과 같은 규칙이다.
      # 자격증명이 없어도 도는 검사라 여기 둔다.
      #
      # 이 단계가 잡지 못하는 것이 하나 있다. 파일이 옳아도 Firestore에
      # 적용되지 않았으면 런타임은 옛 값으로 돈다. regsync는 CI가 아니라
      # 사람이 돌린다 — docs/06-release/go-live-checklist.md 참고.
      - name: 레지스트리 검증
        run: go run ./cmd/regsync --dir=../registry/apps --dry-run

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # -race는 데이터 경합을 잡는다. 원장이 Firestore 트랜잭션과
      # goroutine을 함께 쓰므로 이게 없으면 경합이 CI를 통과한다.
      #
      # 배포 산출물은 deploy.yml이 CGO_ENABLED=0으로 따로 만든다.
      # 여기서 cgo를 쓰는 것은 검사 전용이고 distroless에 올라가는
      # 정적 바이너리에는 영향이 없다.
      - name: go test
        run: go test -race ./...

      # 버전을 고정한다. latest로 두면 린터 기본값이 바뀌는 날
      # 아무도 건드리지 않은 PR이 빨갛게 된다. v2.12.2에서 0 issues임을
      # 로컬에서 확인했다.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          working-directory: server
          version: v2.12.2
