name: RPI Presence Edge

# ## 러너
#
# 세 job 모두 GitHub-hosted `ubuntu-latest`에서 돈다. self-hosted 러너는 쓰지
# 않는다.
#
# - verify는 순수 Go test/build라 클러스터와 무관하다
# - build는 registry.vzyx.xyz로 push하는데 이 레지스트리는 TLS로 공개
#   도달 가능하다. arm64 이미지는 QEMU가 아니라 Go 크로스컴파일로 만든다
#   — Dockerfile.edge가 BUILDPLATFORM과 GOARCH를 쓴다
# - deploy가 붙는 RPI k8s API도 TLS로 공개 도달 가능하다. KUBECONFIG_B64의
#   server는 클러스터 내부 주소가 아니라 그 공개 주소여야 한다
#
# 러너가 x64이므로 kubectl은 linux/amd64 빌드를 받는다. 배포 대상 노드가
# arm64인 것과 무관하다.
#
# ## 배포 범위
#
# deploy는 매니페스트 전체를 apply하지 않고 Deployment의 image만 고정 SHA로
# 바꾼다. kubeconfig identity인 system:serviceaccount:platform:ci-deployer는
# ns platform에서 deployments만 다룰 수 있고 services와 ingresses 권한이
# 없다. 이미지 배포마다 Service와 Ingress를 다시 쓸 이유도 없다.
#
# 따라서 deploy/rpi/presence-edge.yaml의 Service, Ingress, env, resources를
# 바꾸면 이 workflow가 아니라 사람이 직접 apply해야 반영된다.

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "이미지 push 뒤 RPI 클러스터에도 배포"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: rpi-presence-edge
  cancel-in-progress: false

env:
  IMAGE: registry.vzyx.xyz/seorilabs/platform-presence-edge

jobs:
  verify:
    # 순수 Go 검증이라 클러스터 접근이 없다. 아래 두 job과 달리 hosted다.
    name: Verify edge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go test ./internal/presence ./internal/presenceedge ./cmd/presence-edge
      - run: go build ./cmd/presence-edge

  build:
    name: Build ARM64 image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # 예전에는 클러스터 안의 buildkitd를 remote driver로 썼다. 러너가
      # 클러스터를 떠났으므로 러너 안의 기본 driver를 쓴다.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: registry.vzyx.xyz
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: server
          file: server/Dockerfile.edge
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    name: Deploy to RPI
    if: ${{ inputs.deploy }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      # 저장소 파일을 읽지 않는다. image 태그만 바꾸므로 checkout이 필요 없다.
      - name: Set fixed SHA and verify rollout
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          # kubeconfig에 클러스터 자격증명이 들어가므로 이 step이 만드는
          # 파일은 전부 0600으로 떨어뜨린다.
          umask 077
          version="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
          base="https://dl.k8s.io/release/${version}/bin/linux/amd64"
          curl -fsSL -o /tmp/kubectl "${base}/kubectl"
          curl -fsSL -o /tmp/kubectl.sha256 "${base}/kubectl.sha256"
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum --check
          chmod +x /tmp/kubectl
          printf '%s' "$KUBECONFIG_B64" | base64 -d > /tmp/presence-kubeconfig
          export KUBECONFIG=/tmp/presence-kubeconfig
          /tmp/kubectl -n platform set image deployment/platform-presence-edge \
            "edge=${IMAGE}:${GITHUB_SHA}"
          /tmp/kubectl -n platform rollout status deployment/platform-presence-edge --timeout=180s
