# 플랫폼 서버 배포.
#
# 배포 대상이 여섯이고 전부 같은 이미지를 쓴다. 하나라도 빠지면 오래된
# 코드가 결제 경로 옆에서 돈다 — 실제로 겪었다. 2026-08-02에 서비스
# 넷은 p15인데 platform-worker만 p9f로 22시간 뒤처져 있었고, 그 사이
# ledger.go와 verify/service.go가 바뀌었다.
#
# 그래서 이 워크플로는 이미지를 한 번만 만들고 여섯 대상에 같은 태그로
# 올린 뒤, 실제로 같은 태그가 됐는지 다시 확인한다.
#
# ## main 병합이 곧 배포다
#
# 사람이 Actions에서 dispatch해야 배포가 시작되던 구조를 걷어냈다. 손으로
# 끊는 단계는 병합된 코드가 며칠씩 배포되지 않는 드리프트를 만들었고,
# 실제로 그 사이 Backoffice와 Platform의 이벤트 계약이 어긋났다. 병합
# 시점에 리뷰가 끝나므로 배포 직전에 한 번 더 끊을 필요가 없다.
#
# IAP 원장 환경은 production 고정이다. 배포마다 고르지 않는다. registry의
# 기존 원장 앱이 production이 아니면 배포는 시작 전에 실패한다.
#
# workflow_dispatch는 같은 commit을 다시 배포할 때만 쓴다. 빌드 job은 같은
# commit의 이미지가 이미 있으면 건너뛰므로 재배포는 곧바로 배포로 들어간다.
#
# ## 이미지 빌드
#
# 이미지는 Cloud Build에서 만들고 러너는 제출만 한다. ARC RPi 러너에서는
# 무엇을 해도 30분 timeout에 걸렸다 — DIND 안에서 빌드하면 golang 이미지
# pull 6분과 go mod download 9분, Docker를 걷어내고 러너에서 직접 빌드해도
# 모듈 다운로드만 20분이었다. 병목은 컴파일이 아니라 그 러너의 네트워크다.
#
# Cloud Build는 amd64 네이티브고 Artifact Registry와 같은 클라우드 안에
# 있다. 러너는 gcloud만 쓰므로 Docker도 필요 없다.
#
# ## 러너
#
# ARC를 기본으로 쓴다. 이미지는 Cloud Build가 만들고 두 job 모두 gcloud만
# 호출하므로 러너 성능이 배포 시간을 좌우하지 않는다. GitHub-hosted를 기본에
# 두면 Actions 분량을 쓰는데, 이 저장소 몫은 이미 무료 한도를 넘겨 초과 과금
# 구간이다.
#
# ARC가 죽었을 때만 dispatch의 runner 드롭다운에서 github를 고른다. 그 경우
# 분량을 쓰므로 상시로 두지 않는다.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: "러너. ARC가 죽었을 때만 github를 고른다"
        type: choice
        required: false
        default: arc
        options: [arc, github]

permissions:
  contents: read
  id-token: write

# 배포가 겹치면 나중 것이 먼저 끝나 오래된 이미지가 남을 수 있다.
concurrency:
  group: deploy-platform
  cancel-in-progress: false

env:
  PROJECT_ID: seorilabs-platform
  REGION: asia-northeast3
  REGISTRY: asia-northeast3-docker.pkg.dev
  IMAGE_PATH: seorilabs-platform/platform/platform
  DEPLOYER_SA: platform-deployer@seorilabs-platform.iam.gserviceaccount.com
  API_RUNTIME_SA: platform-api@seorilabs-platform.iam.gserviceaccount.com
  INGEST_RUNTIME_SA: platform-ingest@seorilabs-platform.iam.gserviceaccount.com
  ADS_RUNTIME_SA: platform-ads@seorilabs-platform.iam.gserviceaccount.com
  KAKAO_UNLINK_PLATFORM_APP_ID: ungeul
  KAKAO_UNLINK_APP_ID: "1559177"
  BACKOFFICE_OPERATIONAL_EVENTS_URL: https://backoffice.vzyx.xyz/api/internal/platform/operational-events
  PLATFORM_PRESENCE_EDGE_URL: https://edge.vzyx.xyz
  # 실거래만 배포한다. registry의 기존 원장 앱이 이 값과 다르면 배포를
  # 거부하므로, sandbox가 필요해지면 이 워크플로를 먼저 고쳐야 한다.
  IAP_ENVIRONMENT: production

jobs:
  build:
    name: Build and push image
    # 빌드는 Cloud Build에서 돌므로 러너에는 gcloud만 있으면 된다.
    runs-on: ${{ github.event.inputs.runner == 'github' && 'ubuntu-latest' || 'seorilabs-rpi-arm64' }}
    timeout-minutes: 30
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve image reference
        id: meta
        run: echo "image=${REGISTRY}/${IMAGE_PATH}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      # WIF는 external account 자격증명이라 gcloud가 어느 프로젝트로 쿼터를
      # 청구할지 스스로 알지 못한다. 지정하지 않으면 Cloud Build 소스 업로드가
      # "forbidden from accessing the bucket ... serviceusage.services.use"로
      # 막힌다. platform-deployer에는 serviceusage.serviceUsageConsumer가 있다.
      - name: Set quota project
        run: gcloud config set billing/quota_project "$PROJECT_ID"

      # 같은 commit을 다시 배포할 때 빌드를 반복하지 않는다. 재배포가
      # 곧바로 배포 단계로 들어간다.
      - name: Check whether the image already exists
        id: exists
        run: |
          if gcloud artifacts docker images describe "${{ steps.meta.outputs.image }}" --quiet >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "이미 있다. 빌드를 건너뛴다."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # 로그를 우리 버킷에 쓴다. 기본 로그 버킷은 Google이 관리해서 읽으려면
      # 프로젝트 Viewer/Owner가 필요하고, platform-deployer에는 그 권한이 없다.
      # 빌드가 SUCCESS여도 gcloud가 스트리밍에 실패해 exit 1로 끝나 배포가
      # 통째로 건너뛰어졌다. 스테이징 버킷은 이미 deployer가 쓰고 있다.
      - name: Build and push on Cloud Build
        if: steps.exists.outputs.found == 'false'
        run: |
          gcloud builds submit server \
            --project="$PROJECT_ID" \
            --tag="${{ steps.meta.outputs.image }}" \
            --gcs-log-dir="gs://${PROJECT_ID}_cloudbuild/logs" \
            --quiet

      # Cloud Build가 성공했다고 태그가 우리가 기대한 자리에 생겼다는 보장은
      # 없다. 배포가 없는 이미지를 가리키기 전에 여기서 끊는다.
      - name: Assert image exists
        if: steps.exists.outputs.found == 'false'
        run: |
          gcloud artifacts docker images describe "${{ steps.meta.outputs.image }}" \
            --format='value(image_summary.fully_qualified_digest)'

  deploy:
    name: Deploy production runtime
    needs: build
    # gcloud만 쓰므로 Docker가 필요 없다.
    runs-on: ${{ github.event.inputs.runner == 'github' && 'ubuntu-latest' || 'seorilabs-rpi-arm64' }}
    timeout-minutes: 30
    # 보호 규칙은 못 걸지만 배포 이력이 environment에 남는다.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 신규 앱은 registry의 앱별 환경을 사용한다. 전역 환경은 기존 경로를
      # 유지하는 legacy 앱에만 적용되므로 그 앱만 production 고정값과 대조한다.
      - name: Assert registry IAP environments
        run: |
          fail=0
          active=0
          legacy=0
          for file in registry/apps/*.json; do
            enabled=$(jq -r '.features.iap // false' "$file")
            [ "$enabled" = "true" ] || continue

            active=$((active + 1))
            app_id=$(jq -r '.app_id' "$file")
            actual=$(jq -r '.iap.ledger_environment // ""' "$file")
            legacy_unscoped=$(jq -r '.iap.legacy_unscoped_ledger // false' "$file")
            printf '%-24s ledger_environment=%s legacy_unscoped=%s\n' "$app_id" "$actual" "$legacy_unscoped"
            case "$actual" in
              production|sandbox) ;;
              *) fail=1 ;;
            esac
            if [ "$legacy_unscoped" = "true" ]; then
              legacy=$((legacy + 1))
              [ "$actual" = "$IAP_ENVIRONMENT" ] || fail=1
            fi
          done

          [ "$active" -gt 0 ] || { echo "활성 IAP 앱이 없다." >&2; exit 1; }
          [ "$legacy" -gt 0 ] || { echo "기존 원장 호환 앱이 없다." >&2; exit 1; }
          [ "$fail" -eq 0 ] || {
            echo "registry 원장 환경이 잘못됐거나 기존 원장 앱이 배포 환경($IAP_ENVIRONMENT)과 다르다." >&2
            exit 1
          }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      # 서비스 이미지와 IAP 원장 환경을 함께 고정한다. 환경을 명시하지 않으면
      # 이전에 손으로 넣은 값이 다음 배포에도 남아 registry와 런타임이
      # 갈라질 수 있다.
      - name: Deploy services
        run: |
          gcloud run deploy platform-api \
            --project="$PROJECT_ID" --region="$REGION" \
            --image="${{ needs.build.outputs.image }}" \
            --service-account="$API_RUNTIME_SA" \
            --update-env-vars="BACKOFFICE_OPERATIONAL_EVENTS_URL=${BACKOFFICE_OPERATIONAL_EVENTS_URL},KAKAO_UNLINK_PLATFORM_APP_ID=${KAKAO_UNLINK_PLATFORM_APP_ID},KAKAO_UNLINK_APP_ID=${KAKAO_UNLINK_APP_ID}" \
            --update-secrets="PLATFORM_SESSION_SECRET=platform-session-secret:latest,BACKOFFICE_OPERATIONAL_EVENTS_SECRET=backoffice-operational-events-secret:latest,KAKAO_UNLINK_ADMIN_KEY=ungeul-kakao-admin-key:latest" \
            --quiet

          gcloud run deploy platform-ingest \
            --project="$PROJECT_ID" --region="$REGION" \
            --image="${{ needs.build.outputs.image }}" \
            --service-account="$INGEST_RUNTIME_SA" \
            --update-env-vars="PLATFORM_PRESENCE_EDGE_URL=${PLATFORM_PRESENCE_EDGE_URL}" \
            --update-secrets="PLATFORM_SESSION_SECRET=platform-session-secret:latest,PLATFORM_PRESENCE_PRIVATE_KEY=platform-presence-private-key:latest" \
            --quiet

          gcloud run deploy platform-iap \
            --project="$PROJECT_ID" --region="$REGION" \
            --image="${{ needs.build.outputs.image }}" \
            --update-env-vars="IAP_LEDGER_ENVIRONMENT=${IAP_ENVIRONMENT},APPLE_APP_STORE_ENVIRONMENT=${IAP_ENVIRONMENT},BACKOFFICE_OPERATIONAL_EVENTS_URL=${BACKOFFICE_OPERATIONAL_EVENTS_URL}" \
            --update-secrets="PLATFORM_SESSION_SECRET=platform-session-secret:latest,IAP_CATALOG_JSON=iap-catalog:latest,IAP_REFUND_REVIEW_ENCRYPTION_KEYS=iap-refund-review-encryption-keys:latest,IAP_TOSS_CLIENT_CERT=ait-client-cert:latest,IAP_TOSS_CLIENT_KEY=ait-client-key:latest,BACKOFFICE_OPERATIONAL_EVENTS_SECRET=backoffice-operational-events-secret:latest" \
            --quiet

          gcloud run deploy platform-admin \
            --project="$PROJECT_ID" --region="$REGION" \
            --image="${{ needs.build.outputs.image }}" \
            --update-env-vars="IAP_LEDGER_ENVIRONMENT=${IAP_ENVIRONMENT}" \
            --remove-secrets="PLATFORM_SESSION_SECRET" \
            --update-secrets="IAP_CATALOG_JSON=iap-catalog:latest" \
            --quiet

          # Ads는 별도 runtime service account와 기존 세션 secret만 받는다.
          # AIT mTLS secret은 승인 후 별도 gate에서 붙이며, 없을 때 AIT
          # 로그인과 광고는 fail-closed로 동작한다.
          gcloud run deploy platform-ads \
            --project="$PROJECT_ID" --region="$REGION" \
            --image="${{ needs.build.outputs.image }}" \
            --service-account="$ADS_RUNTIME_SA" \
            --no-invoker-iam-check \
            --update-env-vars="PLATFORM_ROLE=ads,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},BACKOFFICE_OPERATIONAL_EVENTS_URL=${BACKOFFICE_OPERATIONAL_EVENTS_URL}" \
            --update-secrets="PLATFORM_SESSION_SECRET=platform-session-secret:latest,BACKOFFICE_OPERATIONAL_EVENTS_SECRET=backoffice-operational-events-secret:latest" \
            --quiet

      - name: Deploy worker job
        run: |
          gcloud run jobs update platform-worker \
            --project="$PROJECT_ID" --region="$REGION" \
            --image="${{ needs.build.outputs.image }}" \
            --update-env-vars="IAP_LEDGER_ENVIRONMENT=${IAP_ENVIRONMENT},APPLE_APP_STORE_ENVIRONMENT=${IAP_ENVIRONMENT},BACKOFFICE_OPERATIONAL_EVENTS_URL=${BACKOFFICE_OPERATIONAL_EVENTS_URL}" \
            --remove-secrets="PLATFORM_SESSION_SECRET" \
            --update-secrets="IAP_CATALOG_JSON=iap-catalog:latest,IAP_REFUND_REVIEW_ENCRYPTION_KEYS=iap-refund-review-encryption-keys:latest,IAP_TOSS_CLIENT_CERT=ait-client-cert:latest,IAP_TOSS_CLIENT_KEY=ait-client-key:latest,BACKOFFICE_OPERATIONAL_EVENTS_SECRET=backoffice-operational-events-secret:latest" \
            --quiet

      # 배포가 전부 성공했다고 같은 태그가 됐다는 보장은 없다.
      # 드리프트를 눈으로 확인하지 않으면 다음에 또 놓친다.
      - name: Assert all targets run the same image
        run: |
          expected="${{ needs.build.outputs.image }}"
          fail=0
          for s in platform-api platform-iap platform-ingest platform-admin platform-ads; do
            actual=$(gcloud run services describe "$s" \
              --project="$PROJECT_ID" --region="$REGION" \
              --format='value(spec.template.spec.containers[0].image)')
            printf '%-18s %s\n' "$s" "$actual"
            [ "$actual" = "$expected" ] || { echo "  기대: $expected" >&2; fail=1; }
          done
          actual=$(gcloud run jobs describe platform-worker \
            --project="$PROJECT_ID" --region="$REGION" \
            --format='value(spec.template.spec.template.spec.containers[0].image)')
          printf '%-18s %s\n' "platform-worker" "$actual"
          [ "$actual" = "$expected" ] || { echo "  기대: $expected" >&2; fail=1; }
          [ "$fail" -eq 0 ] || { echo "배포 대상이 서로 다른 이미지로 돈다." >&2; exit 1; }

      # 세션을 발급하는 role과 이벤트에 신원을 붙이는 ingest만 같은 세션
      # secret을 쓴다. 값은 읽지 않고 Secret Manager 참조 이름만 확인한다.
      - name: Assert session secret boundary
        run: |
          service_secret() {
            gcloud run services describe "$1" \
              --project="$PROJECT_ID" --region="$REGION" --format=json \
              | jq -r '[.spec.template.spec.containers[0].env[]?
                | select(.name == "PLATFORM_SESSION_SECRET")
                | .valueFrom.secretKeyRef.name] | first // ""'
          }

          job_secret() {
            gcloud run jobs describe "$1" \
              --project="$PROJECT_ID" --region="$REGION" --format=json \
              | jq -r '[.spec.template.spec.template.spec.containers[0].env[]?
                | select(.name == "PLATFORM_SESSION_SECRET")
                | .valueFrom.secretKeyRef.name] | first // ""'
          }

          fail=0
          for target in platform-api platform-iap platform-ingest platform-ads; do
            actual=$(service_secret "$target")
            printf '%-18s PLATFORM_SESSION_SECRET=%s\n' "$target" "${actual:-<absent>}"
            [ "$actual" = "platform-session-secret" ] || fail=1
          done

          actual=$(service_secret platform-admin)
          printf '%-18s PLATFORM_SESSION_SECRET=%s\n' platform-admin "${actual:-<absent>}"
          [ -z "$actual" ] || fail=1

          actual=$(job_secret platform-worker)
          printf '%-18s PLATFORM_SESSION_SECRET=%s\n' platform-worker "${actual:-<absent>}"
          [ -z "$actual" ] || fail=1

          [ "$fail" -eq 0 ] || { echo "세션 secret role 경계가 올바르지 않다." >&2; exit 1; }

      # 카카오 Admin Key는 운글 연결 해제 callback을 검증하는 API role에만 둔다.
      # 값은 읽지 않고 앱 ID와 Secret Manager 참조 이름만 확인한다.
      - name: Assert Kakao unlink secret boundary
        run: |
          service_env() {
            gcloud run services describe "$1" \
              --project="$PROJECT_ID" --region="$REGION" --format=json \
              | jq -r --arg name "$2" '[.spec.template.spec.containers[0].env[]?
                | select(.name == $name) | .value] | first // ""'
          }
          service_secret() {
            gcloud run services describe "$1" \
              --project="$PROJECT_ID" --region="$REGION" --format=json \
              | jq -r --arg name "$2" '[.spec.template.spec.containers[0].env[]?
                | select(.name == $name) | .valueFrom.secretKeyRef.name] | first // ""'
          }
          job_env() {
            gcloud run jobs describe "$1" \
              --project="$PROJECT_ID" --region="$REGION" --format=json \
              | jq -r --arg name "$2" '[.spec.template.spec.template.spec.containers[0].env[]?
                | select(.name == $name) | .value] | first // ""'
          }
          job_secret() {
            gcloud run jobs describe "$1" \
              --project="$PROJECT_ID" --region="$REGION" --format=json \
              | jq -r --arg name "$2" '[.spec.template.spec.template.spec.containers[0].env[]?
                | select(.name == $name) | .valueFrom.secretKeyRef.name] | first // ""'
          }

          fail=0
          actual_platform_app=$(service_env platform-api KAKAO_UNLINK_PLATFORM_APP_ID)
          actual_kakao_app=$(service_env platform-api KAKAO_UNLINK_APP_ID)
          actual_secret=$(service_secret platform-api KAKAO_UNLINK_ADMIN_KEY)
          printf '%-18s platform_app=%s kakao_app=%s secret=%s\n' \
            platform-api "$actual_platform_app" "$actual_kakao_app" "$actual_secret"
          [ "$actual_platform_app" = "$KAKAO_UNLINK_PLATFORM_APP_ID" ] || fail=1
          [ "$actual_kakao_app" = "$KAKAO_UNLINK_APP_ID" ] || fail=1
          [ "$actual_secret" = "ungeul-kakao-admin-key" ] || fail=1

          for target in platform-iap platform-ingest platform-admin platform-ads; do
            actual_platform_app=$(service_env "$target" KAKAO_UNLINK_PLATFORM_APP_ID)
            actual_kakao_app=$(service_env "$target" KAKAO_UNLINK_APP_ID)
            actual_secret=$(service_secret "$target" KAKAO_UNLINK_ADMIN_KEY)
            printf '%-18s platform_app=%s kakao_app=%s secret=%s\n' \
              "$target" "${actual_platform_app:-<absent>}" \
              "${actual_kakao_app:-<absent>}" "${actual_secret:-<absent>}"
            [ -z "$actual_platform_app" ] || fail=1
            [ -z "$actual_kakao_app" ] || fail=1
            [ -z "$actual_secret" ] || fail=1
          done

          actual_platform_app=$(job_env platform-worker KAKAO_UNLINK_PLATFORM_APP_ID)
          actual_kakao_app=$(job_env platform-worker KAKAO_UNLINK_APP_ID)
          actual_secret=$(job_secret platform-worker KAKAO_UNLINK_ADMIN_KEY)
          printf '%-18s platform_app=%s kakao_app=%s secret=%s\n' \
            platform-worker "${actual_platform_app:-<absent>}" \
            "${actual_kakao_app:-<absent>}" "${actual_secret:-<absent>}"
          [ -z "$actual_platform_app" ] || fail=1
          [ -z "$actual_kakao_app" ] || fail=1
          [ -z "$actual_secret" ] || fail=1

          [ "$fail" -eq 0 ] || { echo "Kakao unlink secret role 경계가 올바르지 않다." >&2; exit 1; }

      # Presence token 서명키는 익명 이벤트 세션을 Edge token으로 바꾸는
      # ingest role에만 둔다. URL과 키 중 하나만 있으면 프로세스가 시작을
      # 거부하므로 같은 revision에서 함께 readback한다.
      - name: Assert Presence secret boundary
        run: |
          service_env() {
            gcloud run services describe "$1" \
              --project="$PROJECT_ID" --region="$REGION" --format=json \
              | jq -r --arg name "$2" '[.spec.template.spec.containers[0].env[]?
                | select(.name == $name) | .value] | first // ""'
          }
          service_secret() {
            gcloud run services describe "$1" \
              --project="$PROJECT_ID" --region="$REGION" --format=json \
              | jq -r --arg name "$2" '[.spec.template.spec.containers[0].env[]?
                | select(.name == $name) | .valueFrom.secretKeyRef.name] | first // ""'
          }

          fail=0
          actual_url=$(service_env platform-ingest PLATFORM_PRESENCE_EDGE_URL)
          actual_secret=$(service_secret platform-ingest PLATFORM_PRESENCE_PRIVATE_KEY)
          printf '%-18s presence_url=%s secret=%s\n' platform-ingest "$actual_url" "$actual_secret"
          [ "$actual_url" = "$PLATFORM_PRESENCE_EDGE_URL" ] || fail=1
          [ "$actual_secret" = "platform-presence-private-key" ] || fail=1

          for target in platform-api platform-iap platform-admin platform-ads; do
            actual_url=$(service_env "$target" PLATFORM_PRESENCE_EDGE_URL)
            actual_secret=$(service_secret "$target" PLATFORM_PRESENCE_PRIVATE_KEY)
            printf '%-18s presence_url=%s secret=%s\n' "$target" "${actual_url:-<absent>}" "${actual_secret:-<absent>}"
            [ -z "$actual_url" ] || fail=1
            [ -z "$actual_secret" ] || fail=1
          done

          [ "$fail" -eq 0 ] || { echo "Presence URL/secret role 경계가 올바르지 않다." >&2; exit 1; }

      # 조직 DRS는 allUsers IAM binding을 막는다. 공개 callback 서비스는
      # Cloud Run invoker IAM 검사 자체를 끄고 애플리케이션 검증을 사용한다.
      - name: Assert Ads public invocation boundary
        run: |
          actual=$(gcloud run services describe platform-ads \
            --project="$PROJECT_ID" --region="$REGION" --format=json \
            | jq -r '.metadata.annotations["run.googleapis.com/invoker-iam-disabled"] // ""')
          printf 'platform-ads invoker-iam-disabled=%s\n' "$actual"
          [ "$actual" = "true" ] || {
            echo "platform-ads 공개 callback 경계가 열리지 않았다." >&2
            exit 1
          }

      - name: Assert selected IAP environment
        run: |
          service_env() {
            gcloud run services describe "$1" \
              --project="$PROJECT_ID" --region="$REGION" --format=json \
              | jq -r --arg name "$2" '.spec.template.spec.containers[0].env[] | select(.name == $name) | .value'
          }
          job_env() {
            gcloud run jobs describe "$1" \
              --project="$PROJECT_ID" --region="$REGION" --format=json \
              | jq -r --arg name "$2" '.spec.template.spec.template.spec.containers[0].env[] | select(.name == $name) | .value'
          }

          fail=0
          for target in platform-iap platform-admin; do
            actual=$(service_env "$target" IAP_LEDGER_ENVIRONMENT)
            printf '%-18s IAP_LEDGER_ENVIRONMENT=%s\n' "$target" "$actual"
            [ "$actual" = "$IAP_ENVIRONMENT" ] || fail=1
          done

          actual=$(service_env platform-iap APPLE_APP_STORE_ENVIRONMENT)
          printf '%-18s APPLE_APP_STORE_ENVIRONMENT=%s\n' platform-iap "$actual"
          [ "$actual" = "$IAP_ENVIRONMENT" ] || fail=1

          for name in IAP_LEDGER_ENVIRONMENT APPLE_APP_STORE_ENVIRONMENT; do
            actual=$(job_env platform-worker "$name")
            printf '%-18s %s=%s\n' platform-worker "$name" "$actual"
            [ "$actual" = "$IAP_ENVIRONMENT" ] || fail=1
          done

          [ "$fail" -eq 0 ] || { echo "배포한 IAP 환경($IAP_ENVIRONMENT)이 일치하지 않는다." >&2; exit 1; }

      # 구버전 리비전은 v1 catalog에 고정해 둔 뒤 v2 version을 만든다.
      # 새 이미지 배포에서만 latest를 명시적으로 마운트해야 cold start
      # 중 서로 다른 schema를 읽는 구간이 생기지 않는다.
      - name: Assert IAP catalog secret migration
        run: |
          service_catalog() {
            gcloud run services describe "$1" \
              --project="$PROJECT_ID" --region="$REGION" --format=json \
              | jq -r '[.spec.template.spec.containers[0].env[]?
                | select(.name == "IAP_CATALOG_JSON")
                | [.valueFrom.secretKeyRef.name, .valueFrom.secretKeyRef.key]]
                | first // ["", ""] | @tsv'
          }
          job_catalog() {
            gcloud run jobs describe "$1" \
              --project="$PROJECT_ID" --region="$REGION" --format=json \
              | jq -r '[.spec.template.spec.template.spec.containers[0].env[]?
                | select(.name == "IAP_CATALOG_JSON")
                | [.valueFrom.secretKeyRef.name, .valueFrom.secretKeyRef.key]]
                | first // ["", ""] | @tsv'
          }

          fail=0
          for target in platform-iap platform-admin; do
            actual=$(service_catalog "$target")
            printf '%-18s IAP_CATALOG_JSON=%s\n' "$target" "$actual"
            [ "$actual" = $'iap-catalog\tlatest' ] || fail=1
          done
          actual=$(job_catalog platform-worker)
          printf '%-18s IAP_CATALOG_JSON=%s\n' platform-worker "$actual"
          [ "$actual" = $'iap-catalog\tlatest' ] || fail=1

          for target in platform-api platform-ingest platform-ads; do
            actual=$(service_catalog "$target")
            if [ "$actual" = $'\t' ]; then
              display='<absent>'
            else
              display="$actual"
              fail=1
            fi
            printf '%-18s IAP_CATALOG_JSON=%s\n' "$target" "$display"
          done

          [ "$fail" -eq 0 ] || { echo "IAP catalog secret migration 경계가 올바르지 않다." >&2; exit 1; }

      # pending token 봉투를 여는 keyring은 수신 role과 worker에만 있어야 한다.
      # secret 값은 읽지 않고 참조 이름만 readback한다.
      - name: Assert refund review secret boundary
        run: |
          service_secret() {
            gcloud run services describe "$1" \
              --project="$PROJECT_ID" --region="$REGION" --format=json \
              | jq -r --arg name "$2" '[.spec.template.spec.containers[0].env[]?
                | select(.name == $name) | .valueFrom.secretKeyRef.name] | first // ""'
          }
          job_secret() {
            gcloud run jobs describe "$1" \
              --project="$PROJECT_ID" --region="$REGION" --format=json \
              | jq -r --arg name "$2" '[.spec.template.spec.template.spec.containers[0].env[]?
                | select(.name == $name) | .valueFrom.secretKeyRef.name] | first // ""'
          }

          env_name=IAP_REFUND_REVIEW_ENCRYPTION_KEYS
          expected=iap-refund-review-encryption-keys
          fail=0
          actual=$(service_secret platform-iap "$env_name")
          printf '%-18s %s=%s\n' platform-iap "$env_name" "$actual"
          [ "$actual" = "$expected" ] || fail=1

          actual=$(job_secret platform-worker "$env_name")
          printf '%-18s %s=%s\n' platform-worker "$env_name" "$actual"
          [ "$actual" = "$expected" ] || fail=1

          for target in platform-api platform-ingest platform-admin platform-ads; do
            actual=$(service_secret "$target" "$env_name")
            printf '%-18s %s=%s\n' "$target" "$env_name" "${actual:-<absent>}"
            [ -z "$actual" ] || fail=1
          done

          [ "$fail" -eq 0 ] || { echo "환불 검토 secret role 경계가 올바르지 않다." >&2; exit 1; }

      # AIT mTLS 인증서는 주문 검증과 완료 재시도를 수행하는 두 role에만 둔다.
      - name: Assert AppsInToss mTLS secret boundary
        run: |
          service_secret() {
            gcloud run services describe "$1" \
              --project="$PROJECT_ID" --region="$REGION" --format=json \
              | jq -r --arg name "$2" '[.spec.template.spec.containers[0].env[]?
                | select(.name == $name) | .valueFrom.secretKeyRef.name] | first // ""'
          }
          job_secret() {
            gcloud run jobs describe "$1" \
              --project="$PROJECT_ID" --region="$REGION" --format=json \
              | jq -r --arg name "$2" '[.spec.template.spec.template.spec.containers[0].env[]?
                | select(.name == $name) | .valueFrom.secretKeyRef.name] | first // ""'
          }

          fail=0
          for pair in IAP_TOSS_CLIENT_CERT:ait-client-cert IAP_TOSS_CLIENT_KEY:ait-client-key; do
            env_name=${pair%%:*}
            expected=${pair#*:}
            actual=$(service_secret platform-iap "$env_name")
            printf '%-18s %s=%s\n' platform-iap "$env_name" "$actual"
            [ "$actual" = "$expected" ] || fail=1

            actual=$(job_secret platform-worker "$env_name")
            printf '%-18s %s=%s\n' platform-worker "$env_name" "$actual"
            [ "$actual" = "$expected" ] || fail=1

            for target in platform-api platform-ingest platform-admin platform-ads; do
              actual=$(service_secret "$target" "$env_name")
              printf '%-18s %s=%s\n' "$target" "$env_name" "${actual:-<absent>}"
              [ -z "$actual" ] || fail=1
            done
          done

          [ "$fail" -eq 0 ] || { echo "AIT mTLS secret role 경계가 올바르지 않다." >&2; exit 1; }

      - name: Assert Backoffice operational event boundary
        run: |
          service_env() {
            gcloud run services describe "$1" \
              --project="$PROJECT_ID" --region="$REGION" --format=json \
              | jq -r --arg name "$2" '[.spec.template.spec.containers[0].env[]?
                | select(.name == $name) | .value] | first // ""'
          }
          service_secret() {
            gcloud run services describe "$1" \
              --project="$PROJECT_ID" --region="$REGION" --format=json \
              | jq -r --arg name "$2" '[.spec.template.spec.containers[0].env[]?
                | select(.name == $name) | .valueFrom.secretKeyRef.name] | first // ""'
          }
          job_env() {
            gcloud run jobs describe "$1" \
              --project="$PROJECT_ID" --region="$REGION" --format=json \
              | jq -r --arg name "$2" '[.spec.template.spec.template.spec.containers[0].env[]?
                | select(.name == $name) | .value] | first // ""'
          }
          job_secret() {
            gcloud run jobs describe "$1" \
              --project="$PROJECT_ID" --region="$REGION" --format=json \
              | jq -r --arg name "$2" '[.spec.template.spec.template.spec.containers[0].env[]?
                | select(.name == $name) | .valueFrom.secretKeyRef.name] | first // ""'
          }

          fail=0
          for target in platform-api platform-iap platform-ads; do
            actual_url=$(service_env "$target" BACKOFFICE_OPERATIONAL_EVENTS_URL)
            actual_secret=$(service_secret "$target" BACKOFFICE_OPERATIONAL_EVENTS_SECRET)
            printf '%-18s operational_url=%s secret=%s\n' "$target" "$actual_url" "$actual_secret"
            [ "$actual_url" = "$BACKOFFICE_OPERATIONAL_EVENTS_URL" ] || fail=1
            [ "$actual_secret" = "backoffice-operational-events-secret" ] || fail=1
          done

          actual_url=$(job_env platform-worker BACKOFFICE_OPERATIONAL_EVENTS_URL)
          actual_secret=$(job_secret platform-worker BACKOFFICE_OPERATIONAL_EVENTS_SECRET)
          printf '%-18s operational_url=%s secret=%s\n' platform-worker "$actual_url" "$actual_secret"
          [ "$actual_url" = "$BACKOFFICE_OPERATIONAL_EVENTS_URL" ] || fail=1
          [ "$actual_secret" = "backoffice-operational-events-secret" ] || fail=1

          for target in platform-ingest platform-admin; do
            actual_url=$(service_env "$target" BACKOFFICE_OPERATIONAL_EVENTS_URL)
            actual_secret=$(service_secret "$target" BACKOFFICE_OPERATIONAL_EVENTS_SECRET)
            printf '%-18s operational_url=%s secret=%s\n' "$target" "${actual_url:-<absent>}" "${actual_secret:-<absent>}"
            [ -z "$actual_url" ] || fail=1
            [ -z "$actual_secret" ] || fail=1
          done

          [ "$fail" -eq 0 ] || { echo "Backoffice 운영 이벤트 role 경계가 올바르지 않다." >&2; exit 1; }

      # admin은 DRS로 비공개라 인증 없이는 403이 정상이다. 여기서
      # 확인하는 것은 공개 서비스 셋이 새 리비전으로 뜬 뒤 실제로
      # 응답하는지다. 부팅 실패는 ready에서 걸린다.
      - name: Smoke test
        run: |
          fail=0
          for s in api iap ingest ads; do
            url="https://platform-${s}-306278488979.${REGION}.run.app/health/ready"
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
            printf '%-8s %s\n' "$s" "$code"
            [ "$code" = "200" ] || fail=1
          done
          [ "$fail" -eq 0 ] || { echo "health/ready가 200이 아니다." >&2; exit 1; }
