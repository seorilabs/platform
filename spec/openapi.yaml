openapi: 3.0.3

info:
  title: Seorilabs Platform API
  version: 1.0.0-draft
  description: |
    Seorilabs 공통 플랫폼 API.

    ## 계약 규칙

    - **이 문서가 계약의 source of truth다.** Go 타입도 TS 타입도 여기서 생성된 산출물이다
    - **`/v1`은 영구히 깨지지 않는다.** 마켓 배포된 구버전 SDK가 2~3년 산다
    - 필드 **추가만** 허용한다. 제거와 의미 변경은 `/v2`
    - 양방향 forward-compat — 서버는 요청의 미지 필드를 무시하고, SDK는 응답의 미지 필드를 무시한다
    - 모든 응답은 envelope로 감싼다. 성공은 `{ok:true, result}`, 실패는 `{ok:false, error}`
    - 요청 본문 상한 64KiB. 제어문자 거부. 허용 필드 외 어떤 키도 400

    상태: **D0 초안.** 스키마 세부는 각 단계에서 확정한다.

servers:
  - url: https://platform-api.seorilabs.example/v1
    description: 확정 필요 — P0 배포 후 실제 URL로 교체

tags:
  - name: auth
    description: 세션 교환과 갱신
  - name: config
    description: RemoteConfig
  - name: events
    description: 이벤트 수집
  - name: iap
    description: 인앱결제 검증과 entitlement
  - name: webhook
    description: 마켓 서버 알림 수신
  - name: user
    description: 사용자 자체 조작
  - name: admin
    description: 백오피스 전용 운영 조회와 조작

paths:
  /auth/session:
    post:
      tags: [auth]
      summary: 세션 발급
      description: |
        앱별 자격증명을 플랫폼 세션 토큰으로 교환한다.

        부팅 시 왕복을 1회로 줄이기 위해 RemoteConfig와 SDK 상태를 함께 반환한다.
        Godot의 HTTPRequest는 동시 1요청만 처리하므로 이게 중요하다.
      operationId: createSession
      security: []
      parameters:
        - $ref: '#/components/parameters/SeoriApp'
        - $ref: '#/components/parameters/SeoriSdk'
        - $ref: '#/components/parameters/SeoriRuntime'
        - $ref: '#/components/parameters/SeoriAppVer'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '200':
          description: 발급 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/Session'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: 세션 갱신
      operationId: refreshSession
      security: []
      parameters:
        - $ref: '#/components/parameters/SeoriApp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  maxLength: 512
      responses:
        '200':
          description: 갱신 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/Session'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /config:
    get:
      tags: [config]
      summary: RemoteConfig 조회
      description: |
        ETag를 지원한다. 값 변경은 60초 이내에 반영된다.

        인증은 선택이다. anonymous 신원도 조회할 수 있다.
      operationId: getConfig
      security: []
      parameters:
        - $ref: '#/components/parameters/SeoriApp'
        - name: appVersion
          in: query
          schema: { type: string, maxLength: 32 }
        - name: platform
          in: query
          schema: { $ref: '#/components/schemas/ClientPlatform' }
        - name: locale
          in: query
          schema: { type: string, maxLength: 16 }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        '200':
          description: 조회 성공
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/RemoteConfig'
        '304':
          description: 변경 없음
        '403': { $ref: '#/components/responses/Forbidden' }

  /events:
    post:
      tags: [events]
      summary: 이벤트 배치 수집
      description: |
        at-least-once다. **서버에서 dedup하지 않는다.**
        클라이언트가 eventId(ULID)를 넣고 중복 제거는 쿼리에서 한다.

        레지스트리 allowlist에 없는 이벤트는 조용히 버린다.
        PII 키 이름을 가진 파라미터도 버린다.

        부분 수락이다. 일부 이벤트가 거부되어도 200을 반환한다.
      operationId: ingestEvents
      security: []
      parameters:
        - $ref: '#/components/parameters/SeoriApp'
        - $ref: '#/components/parameters/SeoriSdk'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 25
                  items:
                    $ref: '#/components/schemas/ClientEvent'
      responses:
        '200':
          description: 수집됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result:
                        type: object
                        required: [accepted, dropped]
                        properties:
                          accepted: { type: integer }
                          dropped: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /users/me:
    delete:
      tags: [user]
      summary: 플랫폼 사용자 삭제
      description: |
        앱이 계정을 삭제할 때 호출한다.
        PII를 저장하지 않더라도 삭제 경로는 있어야 한다.

        **IAP 원장 문서는 삭제하지 않는다.** 소유자 참조만 끊는다.
      operationId: deleteCurrentUser
      responses:
        '200':
          description: 삭제됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result:
                        type: object
                        properties:
                          deleted: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /iap/google-play/verify:
    post:
      tags: [iap]
      summary: Google Play 구매 검증
      operationId: verifyGooglePlayPurchase
      parameters:
        - $ref: '#/components/parameters/SeoriApp'
        - $ref: '#/components/parameters/AppCheck'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, productId, purchaseToken]
              additionalProperties: false
              properties:
                platform:
                  type: string
                  enum: [google_play]
                productId: { $ref: '#/components/schemas/ProductId' }
                purchaseToken:
                  type: string
                  maxLength: 4096
      responses:
        '200': { $ref: '#/components/responses/VerifyPurchaseOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/ProviderError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /iap/app-store/verify:
    post:
      tags: [iap]
      summary: App Store 구매 검증
      description: |
        **NON_CONSUMABLE이 아닌 상품은 422로 거부한다.**

        canonicalId는 transactionId가 아니라 **originalTransactionId**다.
      operationId: verifyAppStorePurchase
      parameters:
        - $ref: '#/components/parameters/SeoriApp'
        - $ref: '#/components/parameters/AppCheck'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, productId, transactionId]
              additionalProperties: false
              properties:
                platform:
                  type: string
                  enum: [app_store]
                productId: { $ref: '#/components/schemas/ProductId' }
                transactionId:
                  type: string
                  maxLength: 128
      responses:
        '200': { $ref: '#/components/responses/VerifyPurchaseOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/ProviderError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /iap/apps-in-toss/verify:
    post:
      tags: [iap]
      summary: AppsInToss 구매 검증
      description: |
        **tossUserKey는 body로 받지 않는다.** 검증된 토큰의 claim에서만 읽는다.

        AIT는 계정 바인딩 HMAC 검증에서 면제된다. claim 자체가 신뢰 경로다.
        따라서 anonymous 신원은 이 엔드포인트를 쓸 수 없다.
      operationId: verifyAppsInTossPurchase
      parameters:
        - $ref: '#/components/parameters/SeoriApp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, productId, orderId]
              additionalProperties: false
              properties:
                platform:
                  type: string
                  enum: [apps_in_toss]
                productId: { $ref: '#/components/schemas/ProductId' }
                orderId:
                  type: string
                  maxLength: 128
      responses:
        '200': { $ref: '#/components/responses/VerifyPurchaseOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '502': { $ref: '#/components/responses/ProviderError' }

  /iap/entitlements:
    get:
      tags: [iap]
      summary: entitlement 목록 조회
      description: |
        마켓 SDK가 없어도 이 엔드포인트만으로 환불 projection을 반영할 수 있다.
      operationId: listEntitlements
      parameters:
        - $ref: '#/components/parameters/SeoriApp'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result:
                        type: object
                        required: [status, entitlements]
                        properties:
                          status:
                            type: string
                            enum: [verified]
                          entitlements:
                            type: array
                            items: { $ref: '#/components/schemas/EntitlementId' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /iap/account-references:
    post:
      tags: [iap]
      summary: 마켓 계정 참조 발급
      description: |
        Google과 Apple 신규 구매 전에 클라이언트가 받아 마켓 SDK에 넘긴다.

        HMAC keyring으로 생성한다. 첫 항목이 현재 키이고 나머지는 회전 검증용이다.
      operationId: getAccountReferences
      parameters:
        - $ref: '#/components/parameters/SeoriApp'
      responses:
        '200':
          description: 발급 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result:
                        type: object
                        required: [googlePlayObfuscatedAccountId, appStoreAppAccountToken]
                        properties:
                          googlePlayObfuscatedAccountId:
                            type: string
                          appStoreAppAccountToken:
                            type: string
                            format: uuid
        '401': { $ref: '#/components/responses/Unauthorized' }

  /iap/webhooks/app-store:
    post:
      tags: [webhook]
      summary: App Store Server Notification v2 수신
      description: |
        **인증이 곧 JWS 서명 검증이다.** 별도 토큰이 없다.

        처리 대상은 ONE_TIME_CHARGE, REFUND, REFUND_DECLINED, REFUND_REVERSED, REVOKE.
        그 외는 무시한다.

        **알림만으로 신규 지급을 하지 않는다.** 기존 소유자의 상태만 재조정한다.
      operationId: receiveAppStoreNotification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signedPayload]
              additionalProperties: false
              properties:
                signedPayload:
                  type: string
      responses:
        '200':
          description: 처리 또는 무시
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/WebhookOutcome'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /iap/webhooks/google-play:
    post:
      tags: [webhook]
      summary: Google Play RTDN 수신
      description: |
        Pub/Sub push subscription. OIDC 토큰으로 인증한다.

        topic은 `play-iap-rtdn` 고정이다. "goog" prefix가 금지되어 이 이름이어야 한다.

        부분환불은 지원하지 않고 422로 거부한다.
        pendingRefundReview는 원장에 기록만 하고 자동 응답하지 않는다.
      operationId: receiveGooglePlayRtdn
      security:
        - PubSubOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: object
                  required: [data, messageId]
                  properties:
                    data: { type: string, format: byte }
                    messageId: { type: string }
                    publishTime: { type: string, format: date-time }
                subscription: { type: string }
      responses:
        '200':
          description: 처리 또는 무시
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/WebhookOutcome'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/health:
    get:
      tags: [admin]
      summary: 플랫폼 운영 상태 조회
      operationId: getAdminHealth
      security: [{ AdminOidc: [] }]
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/AdminHealth'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/orders/recent:
    get:
      tags: [admin]
      summary: 최근 IAP 주문 조회
      operationId: listAdminRecentOrders
      security: [{ AdminOidc: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminLimit'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result:
                        type: object
                        required: [orders]
                        properties:
                          orders:
                            type: array
                            items: { $ref: '#/components/schemas/AdminOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/users/{reference}:
    get:
      tags: [admin]
      summary: PII 없는 플랫폼 사용자 조회
      description: |
        `platformUserId` 또는 정확한 `supportCode`로만 조회한다.
        이메일, 이름, 전화번호, 앱 사용자 식별자는 반환하지 않는다.
      operationId: getAdminUser
      security: [{ AdminOidc: [] }]
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            oneOf:
              - { type: string, pattern: '^pu_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
              - { type: string, pattern: '^[A-Z]{1,3}-[0-9A-HJKMNP-TV-Z]{8}$' }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result:
                        type: object
                        required: [user]
                        properties:
                          user: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/{puid}/entitlements:
    get:
      tags: [admin]
      summary: 사용자 entitlement 전체 조회
      description: 활성 여부와 무관하게 source를 포함해 반환한다.
      operationId: listAdminUserEntitlements
      security: [{ AdminOidc: [] }]
      parameters:
        - name: puid
          in: path
          required: true
          schema: { type: string, pattern: '^pu_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result:
                        type: object
                        required: [platformUserId, entitlements]
                        properties:
                          platformUserId: { type: string }
                          entitlements:
                            type: array
                            items: { $ref: '#/components/schemas/AdminEntitlement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/operator-grants:
    get:
      tags: [admin]
      summary: 운영자 지급과 회수 이력 조회
      operationId: listAdminOperatorGrants
      security: [{ AdminOidc: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminLimit'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result:
                        type: object
                        required: [grants, revocations]
                        properties:
                          grants:
                            type: array
                            items: { $ref: '#/components/schemas/AdminOperatorRecord' }
                          revocations:
                            type: array
                            items: { $ref: '#/components/schemas/AdminOperatorRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/iap/catalog:
    get:
      tags: [admin]
      summary: 관리 가능한 entitlement ID 목록 조회
      description: SKU와 마켓 자격증명은 반환하지 않는다.
      operationId: getAdminIapCatalog
      security: [{ AdminOidc: [] }]
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result:
                        type: object
                        required: [entitlements]
                        properties:
                          entitlements:
                            type: array
                            items: { $ref: '#/components/schemas/EntitlementId' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/entitlements/grant:
    post:
      tags: [admin]
      summary: 운영자 entitlement 지급
      description: |
        write allowlist 전용이다. 서버가 앱, 사용자 소속, 원장 환경, 카탈로그와
        typed confirmation을 모두 검증한 뒤 원장과 감사 레코드를 한 트랜잭션으로 쓴다.
      operationId: grantAdminEntitlement
      security: [{ AdminOidc: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminActor'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminGrantRequest' }
      responses:
        '200': { $ref: '#/components/responses/AdminMutationOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/entitlements/revoke:
    post:
      tags: [admin]
      summary: 운영자 지급 source 회수
      description: |
        `grantRequestId`로 지정한 operator source만 revoked로 바꾼다.
        Google Play, App Store, AppsInToss source는 절대 변경하지 않는다.
      operationId: revokeAdminEntitlement
      security: [{ AdminOidc: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminActor'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminRevokeRequest' }
      responses:
        '200': { $ref: '#/components/responses/AdminMutationOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/iap/sandbox-reset:
    post:
      tags: [admin]
      summary: App Store sandbox 원장 초기화
      description: App Store Connect에서 구매 내역을 지운 뒤 sandbox 원장에만 반영한다.
      operationId: resetAdminAppStoreSandbox
      security: [{ AdminOidc: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminActor'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSandboxResetRequest' }
      responses:
        '200':
          description: 반영 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result:
                        type: object
                        required: [platformUserId, resetOrderKeys]
                        additionalProperties: false
                        properties:
                          platformUserId: { type: string, pattern: '^pu_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
                          resetOrderKeys:
                            type: array
                            items: { type: string, pattern: '^[0-9a-f]{64}$' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/config/maintenance:
    post:
      tags: [admin]
      summary: 앱 점검 모드 변경
      operationId: setAdminMaintenance
      security: [{ AdminOidc: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminActor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appId, minutes]
              additionalProperties: false
              properties:
                appId: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
                minutes: { type: integer, minimum: 0, maximum: 1440 }
      responses:
        '200':
          description: 변경 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result:
                        type: object
                        required: [appId, active, minutes]
                        additionalProperties: false
                        properties:
                          appId: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
                          active: { type: boolean }
                          minutes: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

components:
  securitySchemes:
    PlatformToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '`/auth/session`이 발급한 플랫폼 세션 토큰'
    PubSubOidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Pub/Sub push subscription이 붙이는 Google OIDC 토큰
    AdminOidc:
      type: http
      scheme: bearer
      bearerFormat: Google OIDC ID token
      description: |
        Cloud Run Admin audience를 대상으로 발급한 Google OIDC ID token.
        GET은 read 또는 write allowlist, mutation은 write allowlist만 허용한다.

  parameters:
    SeoriApp:
      name: X-Seori-App
      in: header
      required: true
      description: |
        앱 식별자. **권한이 아니라 어느 프로젝트로 검증할지 고르는 힌트다.**
        헤더를 바꿔도 토큰의 aud 불일치로 거부된다.
      schema:
        type: string
        pattern: '^[a-z0-9-]{1,64}$'
    SeoriSdk:
      name: X-Seori-Sdk
      in: header
      description: 'SDK 종류와 버전. 예 `gd/0.3.1`, `ts/0.3.1`. 구버전 트래픽 관측에 쓴다'
      schema: { type: string, maxLength: 32 }
    SeoriRuntime:
      name: X-Seori-Runtime
      in: header
      description: '`godot-native-android`, `godot-web-ait`, `rn-ios`, `ait-rn`, `web`'
      schema: { type: string, maxLength: 32 }
    SeoriAppVer:
      name: X-Seori-AppVer
      in: header
      description: 앱 버전. RemoteConfig 타겟팅에 쓴다
      schema: { type: string, maxLength: 32 }
    AppCheck:
      name: X-Firebase-AppCheck
      in: header
      description: |
        레지스트리 `require_app_check`가 true인 앱에서만 필수다.

        1단계는 optional로 시작한다. Godot에 App Check SDK가 없고
        replay 방지(consume)가 Go SDK에 없다.
      schema: { type: string }
    AdminLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    AdminActor:
      name: X-Seori-Actor
      in: header
      required: false
      description: |
        작업을 승인한 GitHub login. 권한 판단에는 쓰지 않으며 형식만 검증한다.
        없거나 형식이 다르면 OIDC principal의 SHA-256 참조를 저장한다.
        grant, revoke, sandbox reset의 멱등 payload 일부이므로 unknown 결과를 같은
        requestId로 재시도할 때는 최초 값을 그대로 보내야 한다.
      schema:
        type: string
        pattern: '^[A-Za-z0-9-]{1,39}$'

  schemas:
    EnvelopeOk:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]

    EnvelopeError:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: snake_case 에러 코드. 전체 목록은 docs/03-architecture/iap.md
              example: purchase_owned_by_another_user
            message:
              type: string
              description: 한국어 메시지. 클라이언트가 이 문자열로 분기하지 않는다

    ClientPlatform:
      type: string
      enum: [android, ios, web, ait]

    ProductId:
      type: string
      maxLength: 128
      pattern: '^[A-Za-z0-9._-]{1,128}$'

    EntitlementId:
      type: string
      maxLength: 128
      pattern: '^[A-Za-z0-9._-]{1,128}$'

    CreateSessionRequest:
      type: object
      required: [appId, credential]
      additionalProperties: false
      properties:
        appId:
          type: string
          pattern: '^[a-z0-9-]{1,64}$'
        credential:
          type: object
          required: [kind, value]
          additionalProperties: false
          properties:
            kind:
              type: string
              enum: [firebase-id-token, ait-login, anonymous]
              description: |
                **anonymous는 사칭 가능한 신원이다.**
                RemoteConfig 조회와 이벤트 로그만 허용하고 IAP는 금지한다.
            value:
              type: string
              maxLength: 4096

    Session:
      type: object
      required:
        [platformToken, refreshToken, platformUserId, expiresIn, serverTimeUnix, features, sdk]
      properties:
        platformToken: { type: string }
        refreshToken: { type: string }
        platformUserId:
          type: string
          pattern: '^pu_[0-9A-HJKMNP-TV-Z]{26}$'
          description: 'pu_ + ULID. firebase_uid에서 파생하지 않는다'
        appUserId:
          type: string
          description: 앱 쪽 식별자. 디버깅용
        expiresIn:
          type: integer
          description: 초
        serverTimeUnix:
          type: integer
          format: int64
        isAnonymous:
          type: boolean
          description: true면 IAP 경로가 막힌다
        features:
          $ref: '#/components/schemas/Features'
        sdk:
          $ref: '#/components/schemas/SdkStatus'
        maintenance:
          $ref: '#/components/schemas/Maintenance'
        configEtag:
          type: string
          description: 이 값이 그대로면 /config를 호출할 필요가 없다

    Features:
      type: object
      additionalProperties:
        type: boolean
      example:
        iap: true
        events: true
        config: true

    SdkStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, deprecated, blocked]
          description: |
            **마켓 배포된 구버전 SDK를 서버에서 끄는 유일한 수단이다.**
            blocked면 SDK가 이벤트만 남기고 나머지를 정지한다.
        message: { type: string }
        updateUrl: { type: string }
        minSupportedVersion: { type: string }

    Maintenance:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
        message: { type: string }
        until: { type: string, format: date-time }

    RemoteConfig:
      type: object
      required: [values, features, sdk, maintenance]
      properties:
        values:
          type: object
          additionalProperties: true
          description: 앱별 임의 키-값. 기본값은 클라이언트 SDK에 하드코딩해 둔다
        features:
          $ref: '#/components/schemas/Features'
        sdk:
          $ref: '#/components/schemas/SdkStatus'
        maintenance:
          $ref: '#/components/schemas/Maintenance'

    ClientEvent:
      type: object
      required: [eventId, name, tsUnixMs]
      additionalProperties: false
      properties:
        eventId:
          type: string
          description: 클라이언트 생성 ULID. at-least-once라 중복 제거는 쿼리에서 한다
          maxLength: 32
        name:
          type: string
          maxLength: 40
          description: lowercase snake_case. 40자 초과는 drop
        tsUnixMs:
          type: integer
          format: int64
          description: 클라이언트 시각. 서버가 ±48시간으로 clamp한다
        sessionId:
          type: string
          maxLength: 64
        params:
          type: object
          additionalProperties: true
          description: |
            최대 25개. 정규화 규약은 spec/conformance/param-normalization.json이 정본이다.
            boolean은 1/0, NaN·Inf는 0, null은 drop, 객체·배열은 drop.
            PII 키 이름은 서버와 SDK 양쪽에서 drop한다.

    VerifyPurchaseOutcome:
      type: object
      required: [status, entitlementId, entitlements]
      properties:
        status:
          type: string
          enum: [verified, pending, revoked]
        entitlementId:
          $ref: '#/components/schemas/EntitlementId'
        granted:
          type: boolean
          description: |
            **granted와 alreadyGranted는 항상 배타적이다.**
            둘 다 false인 조합은 존재하지 않는다. status가 verified일 때만 존재한다.
        alreadyGranted:
          type: boolean
        entitlements:
          type: array
          items: { $ref: '#/components/schemas/EntitlementId' }
        completion:
          $ref: '#/components/schemas/Completion'
        blockedBySandboxReset:
          type: boolean
          description: sandbox 초기화로 재지급이 차단된 경우에만 존재한다

    Completion:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum:
            - none
            - retry_server_completion
            - apps_in_toss_complete_product_grant
            - app_store_sync_after_sandbox_reset
          description: |
            retry_server_completion은 **지급이 이미 커밋된 상태**를 뜻한다.
            마켓 완료 호출만 실패했고 서버 outbox가 재시도한다. 롤백하지 않는다.
        orderId:
          type: string
          description: apps_in_toss_complete_product_grant일 때만

    WebhookOutcome:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [processed, duplicate, ignored, ignored_invalid, test_notification]

    AdminHealth:
      type: object
      required: [environment, deadLetterCount]
      additionalProperties: false
      properties:
        environment: { $ref: '#/components/schemas/LedgerEnvironment' }
        deadLetterCount: { type: integer, minimum: 0 }

    LedgerEnvironment:
      type: string
      enum: [sandbox, production]

    AdminMutationReason:
      type: string
      description: PII나 결제 자격정보를 저장하지 않는 고정 운영 사유 코드
      enum:
        - customer_support_compensation
        - incorrect_grant_correction
        - incident_recovery
        - internal_validation

    AdminUser:
      type: object
      required: [platformUserId, appId, supportCode, isAnonymous, createdAt, lastSeenAt]
      additionalProperties: false
      properties:
        platformUserId: { type: string, pattern: '^pu_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
        appId: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
        supportCode: { type: string, pattern: '^[A-Z]{1,3}-[0-9A-HJKMNP-TV-Z]{8}$' }
        isAnonymous: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }

    AdminOrder:
      type: object
      required:
        [orderKey, appId, platformUserId, entitlementId, platform, productId, state, purchasedAt, observedAt, tombstone]
      additionalProperties: false
      properties:
        orderKey: { type: string, pattern: '^[0-9a-f]{64}$' }
        appId:
          description: PII 없는 사용자 binding에서 도출. 삭제 사용자 또는 owner 없는 tombstone은 빈 문자열.
          oneOf:
            - { type: string, pattern: '^[a-z0-9-]{1,64}$' }
            - { type: string, enum: [''] }
        platformUserId:
          description: 일반 주문은 정확한 PUID. owner 없는 tombstone만 빈 문자열.
          oneOf:
            - { type: string, pattern: '^pu_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
            - { type: string, enum: [''] }
        entitlementId:
          description: owner 없는 tombstone만 빈 문자열.
          oneOf:
            - { $ref: '#/components/schemas/EntitlementId' }
            - { type: string, enum: [''] }
        platform: { type: string, enum: [google_play, app_store, apps_in_toss, operator] }
        productId:
          description: owner 없는 tombstone만 빈 문자열.
          oneOf:
            - { type: string, pattern: '^[A-Za-z0-9._-]{1,256}$' }
            - { type: string, enum: [''] }
        state: { type: string, enum: [active, pending, revoked, invalid] }
        purchasedAt: { type: string, format: date-time }
        observedAt: { type: string, format: date-time }
        tombstone: { type: boolean }

    AdminEntitlementSource:
      type: object
      required: [platform, productId, state, orderKey, observedAt]
      additionalProperties: false
      properties:
        platform: { type: string, enum: [google_play, app_store, apps_in_toss, operator] }
        productId: { type: string, pattern: '^[A-Za-z0-9._-]{1,256}$' }
        state: { type: string, enum: [active, pending, revoked, invalid] }
        orderKey: { type: string, pattern: '^[0-9a-f]{64}$' }
        observedAt: { type: string, format: date-time }

    AdminEntitlement:
      type: object
      required: [entitlementId, active, updatedAt, sources]
      additionalProperties: false
      properties:
        entitlementId: { $ref: '#/components/schemas/EntitlementId' }
        active: { type: boolean }
        updatedAt: { type: string, format: date-time }
        sources:
          type: array
          items: { $ref: '#/components/schemas/AdminEntitlementSource' }

    AdminOperatorRecord:
      type: object
      required: [requestId, platformUserId, entitlementId, actorLogin, reason, appId, createdAt, kind]
      additionalProperties: false
      properties:
        requestId: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }
        grantRequestId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,128}$'
          description: 회수 이력에서 대상 operator 지급 requestId. 지급 이력에서는 생략한다.
        platformUserId: { type: string, pattern: '^pu_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
        entitlementId: { $ref: '#/components/schemas/EntitlementId' }
        actorLogin:
          type: string
          pattern: '^(?:[A-Za-z0-9-]{1,39}|oidc_sha256:[0-9a-f]{64})$'
        reason: { $ref: '#/components/schemas/AdminMutationReason' }
        appId: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
        createdAt: { type: string, format: date-time }
        kind: { type: string, enum: [grant, revoke] }

    AdminGrantRequest:
      type: object
      required: [requestId, appId, platformUserId, entitlementId, reason, expectedEnvironment, confirmation]
      additionalProperties: false
      properties:
        requestId: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }
        appId: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
        platformUserId: { type: string, pattern: '^pu_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
        entitlementId: { $ref: '#/components/schemas/EntitlementId' }
        reason: { $ref: '#/components/schemas/AdminMutationReason' }
        expectedEnvironment: { $ref: '#/components/schemas/LedgerEnvironment' }
        confirmation:
          type: string
          maxLength: 512
          description: '`GRANT {appId} {platformUserId} {entitlementId}`와 정확히 일치'

    AdminRevokeRequest:
      type: object
      required:
        [requestId, grantRequestId, appId, platformUserId, entitlementId, reason, expectedEnvironment, confirmation]
      additionalProperties: false
      properties:
        requestId: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }
        grantRequestId: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }
        appId: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
        platformUserId: { type: string, pattern: '^pu_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
        entitlementId: { $ref: '#/components/schemas/EntitlementId' }
        reason: { $ref: '#/components/schemas/AdminMutationReason' }
        expectedEnvironment: { $ref: '#/components/schemas/LedgerEnvironment' }
        confirmation:
          type: string
          maxLength: 512
          description: '`REVOKE {appId} {platformUserId} {entitlementId} {grantRequestId}`와 정확히 일치'

    AdminSandboxResetRequest:
      type: object
      required:
        [requestId, appId, platformUserId, reason, expectedEnvironment, confirmation, appleClearedConfirmed]
      additionalProperties: false
      properties:
        requestId: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }
        appId: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
        platformUserId: { type: string, pattern: '^pu_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
        reason: { $ref: '#/components/schemas/AdminMutationReason' }
        expectedEnvironment:
          type: string
          enum: [sandbox]
        confirmation:
          type: string
          maxLength: 512
          description: '`RESET {appId} {platformUserId}`와 정확히 일치'
        appleClearedConfirmed: { type: boolean }

  responses:
    BadRequest:
      description: 요청 형식 오류. 허용 필드 외 키가 있어도 여기로 온다
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    NotFound:
      description: 대상을 찾지 못함
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    Forbidden:
      description: 권한 부족, 앱 paused, anonymous 또는 관리 allowlist 불일치
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    Conflict:
      description: 다른 소유자의 구매이거나 replay 불일치
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    Unprocessable:
      description: 구매가 유효하지 않거나 상품 타입이 맞지 않음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    PayloadTooLarge:
      description: 본문 64KiB 초과
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    RateLimited:
      description: 한도 초과
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    ProviderError:
      description: 마켓 API 오류
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    ServiceUnavailable:
      description: 설정 오류이거나 일시적 처리 불가
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    VerifyPurchaseOk:
