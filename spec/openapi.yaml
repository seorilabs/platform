openapi: 3.0.3

info:
  title: Seorilabs Platform API
  version: 1.0.0-draft
  description: |
    Seorilabs 공통 플랫폼 API.

    ## 계약 규칙

    - **이 문서가 계약의 source of truth다.** Go 타입도 TS 타입도 여기서 생성된 산출물이다
    - **`/v1`은 영구히 깨지지 않는다.** 마켓 배포된 구버전 SDK가 2~3년 산다
    - 필드 **추가만** 허용한다. 제거와 의미 변경은 `/v2`
    - 양방향 forward-compat — 서버는 요청의 미지 필드를 무시하고, SDK는 응답의 미지 필드를 무시한다
    - 모든 응답은 envelope로 감싼다. 성공은 `{ok:true, result}`, 실패는 `{ok:false, error}`
    - 요청 본문 상한 64KiB. 제어문자 거부. 허용 필드 외 어떤 키도 400

    상태: **D0 초안.** 스키마 세부는 각 단계에서 확정한다.

servers:
  - url: https://platform-api.seorilabs.example/v1
    description: 확정 필요 — P0 배포 후 실제 URL로 교체

tags:
  - name: auth
    description: 세션 교환과 갱신
  - name: config
    description: RemoteConfig
  - name: events
    description: 이벤트 수집
  - name: presence
    description: RPI Edge의 fail-open 최근 활성 세션
  - name: iap
    description: 인앱결제 검증과 entitlement
  - name: ads
    description: 광고 정책과 보상 claim
  - name: content
    description: private 릴리스의 인증된 선택 전달
  - name: webhook
    description: 마켓 서버 알림 수신
  - name: user
    description: 사용자 자체 조작
  - name: admin
    description: 백오피스 전용 운영 조회와 조작

paths:
  /auth/session:
    post:
      tags: [auth]
      summary: 세션 발급
      description: |
        앱별 자격증명을 플랫폼 세션 토큰으로 교환한다.

        부팅 시 왕복을 1회로 줄이기 위해 RemoteConfig와 SDK 상태를 함께 반환한다.
        Godot의 HTTPRequest는 동시 1요청만 처리하므로 이게 중요하다.
      operationId: createSession
      security: []
      parameters:
        - $ref: '#/components/parameters/SeoriApp'
        - $ref: '#/components/parameters/AppCheck'
        - $ref: '#/components/parameters/SeoriSdk'
        - $ref: '#/components/parameters/SeoriRuntime'
        - $ref: '#/components/parameters/SeoriAppVer'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '200':
          description: 발급 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/Session'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: 세션 갱신
      operationId: refreshSession
      security: []
      parameters:
        - $ref: '#/components/parameters/SeoriApp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  maxLength: 512
      responses:
        '200':
          description: 갱신 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/Session'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/firebase-custom-token:
    post:
      tags: [auth]
      summary: Firebase custom token bridge
      description: |
        platform이 검증하거나 새로 만든 앱 사용자 uid로 Firebase custom token을 발급한다.

        기존 Firebase ID token을 보내면 그 uid를 그대로 사용해 기존 Firestore 소유권을
        보존한다. 토큰이 없으면 uid는 서버가 생성한다. 클라이언트가 uid를 직접 고를 수
        없으며, 이 응답의 custom token은 즉시 `signInWithCustomToken`에 사용하고 저장하지 않는다.
      operationId: createFirebaseCustomToken
      security: []
      parameters:
        - $ref: '#/components/parameters/SeoriApp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFirebaseCustomTokenRequest'
      responses:
        '200':
          description: 발급 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/FirebaseCustomToken'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/firebase-account:
    delete:
      tags: [auth]
      summary: Firebase 사용자 Platform 매핑 삭제
      description: |
        앱의 Firebase ID token을 검증하고 해당 uid의 Platform identity 매핑과
        PII 없는 사용자 문서를 삭제한다. Firebase Auth와 앱 데이터 삭제는 앱
        프로젝트가 이어서 수행한다. IAP 감사 원장은 삭제하지 않는다.
      operationId: deleteFirebaseAccount
      security: []
      parameters:
        - $ref: '#/components/parameters/SeoriApp'
        - $ref: '#/components/parameters/AppCheck'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appId, firebaseIdToken]
              additionalProperties: false
              properties:
                appId: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
                firebaseIdToken:
                  type: string
                  minLength: 1
                  maxLength: 4096
      responses:
        '200':
          description: 삭제 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result:
                        type: object
                        required: [deleted]
                        properties:
                          deleted: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /config:
    get:
      tags: [config]
      summary: RemoteConfig 조회
      description: |
        ETag를 지원한다. 값 변경은 60초 이내에 반영된다.

        인증은 선택이다. anonymous 신원도 조회할 수 있다.
      operationId: getConfig
      security: []
      parameters:
        - $ref: '#/components/parameters/SeoriApp'
        - name: appVersion
          in: query
          schema: { type: string, maxLength: 32 }
        - name: platform
          in: query
          schema: { $ref: '#/components/schemas/ClientPlatform' }
        - name: locale
          in: query
          schema: { type: string, maxLength: 16 }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        '200':
          description: 조회 성공
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/RemoteConfig'
        '304':
          description: 변경 없음
        '403': { $ref: '#/components/responses/Forbidden' }

  /content/version:
    get:
      tags: [content]
      summary: 활성 콘텐츠 버전 조회
      description: 원본 manifest나 전체 ID 목록 없이 현재 버전과 스키마만 반환한다.
      operationId: getContentVersion
      security: [{ PlatformToken: [] }]
      parameters:
        - $ref: '#/components/parameters/SeoriApp'
        - $ref: '#/components/parameters/ContentAppCheck'
      responses:
        '200':
          description: 활성 정상본
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    required: [result]
                    properties:
                      result: { $ref: '#/components/schemas/ContentVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /content/readings:resolve:
    post:
      tags: [content]
      summary: 파생 명식에 성립하는 해설 선택
      description: |
        생년월일, 출생시각, 장소, 프로필명은 받지 않는다. 앱이 보낸 파생 명식 사실을
        selector가 축별 enum, 개수, 중복, 고정 조합과 명식 관계로 다시 검증하고 해당
        좌표만 선택한다. 임의 article ID 배열은 받지 않는다.

        같은 파생 사실은 같은 `readingKey`를 만들며 재조회는 신규 명식 일일 한도에서
        제외한다. `unlock`은 `reward_claim` 또는 `ticket`만 허용한다. 한 번 해금한
        `flow:{year}`는 같은 명식의 세운과 12개월 월운을 함께 연다. 서버 권한 근거가
        없으면 오류로 우회하지 않고 해당 심화 섹션을 `locked`로 반환한다.
      operationId: resolveContentReading
      security: [{ PlatformToken: [] }]
      parameters:
        - $ref: '#/components/parameters/SeoriApp'
        - $ref: '#/components/parameters/ContentAppCheck'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveContentReadingRequest' }
      responses:
        '200':
          description: 선택 결과. 잠긴 심화 본문은 articles에 포함하지 않는다.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    required: [result]
                    properties:
                      result: { $ref: '#/components/schemas/ResolvedContentReading' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /content/terms/{termId}:
    get:
      tags: [content]
      summary: 사전 단일 항목 조회
      description: 활성 릴리스에서 `term` context로 분류된 한 항목만 반환한다.
      operationId: getContentTerm
      security: [{ PlatformToken: [] }]
      parameters:
        - $ref: '#/components/parameters/SeoriApp'
        - $ref: '#/components/parameters/ContentAppCheck'
        - name: termId
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9가-힣][a-z0-9가-힣._-]{0,127}$' }
      responses:
        '200':
          description: 사전 항목
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    required: [result]
                    properties:
                      result:
                        type: object
                        required: [schemaVersion, contentVersion, article]
                        properties:
                          schemaVersion: { type: integer, minimum: 1 }
                          contentVersion: { $ref: '#/components/schemas/ContentVersionId' }
                          article: { $ref: '#/components/schemas/ContentArticle' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /presence/token:
    post:
      tags: [presence]
      summary: RPI Edge presence token 발급
      description: |
        앱이 만든 비식별 session ID를 Edge 전용 단기 token으로 교환한다.
        기능이 꺼졌거나 발급기가 준비되지 않았으면 오류 대신 enabled=false를
        반환한다. Presence 실패가 앱 동작이나 기존 이벤트 전송을 막아서는 안 된다.
      operationId: createPresenceToken
      security: []
      parameters:
        - $ref: '#/components/parameters/SeoriApp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePresenceTokenRequest'
      responses:
        '200':
          description: 활성화 상태와, 활성화된 경우 Edge token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/PresenceBootstrap'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /presence/heartbeat:
    post:
      servers:
        - url: https://edge.vzyx.xyz/v1
          description: vzyx-cluster RPI public Edge
      tags: [presence]
      summary: 최근 활성 세션 갱신
      description: |
        서버 수신 시각으로 150초 활성 TTL을 갱신한다. 클라이언트 시각은 받지
        않는다. 네트워크·인증·Edge·DB 실패 시 같은 heartbeat를 재시도하거나
        outbox에 넣지 않고 다음 주기에 새 heartbeat만 보낸다.
      operationId: heartbeatPresence
      security: [{ PresenceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresenceHeartbeatRequest'
      responses:
        '200':
          description: 최신 상태 반영
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result:
                        type: object
                        required: [acceptedAt]
                        additionalProperties: false
                        properties:
                          acceptedAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /events:
    post:
      tags: [events]
      summary: 이벤트 배치 수집
      description: |
        at-least-once다. **서버에서 dedup하지 않는다.**
        클라이언트가 eventId(ULID)를 넣고 중복 제거는 쿼리에서 한다.

        레지스트리 allowlist에 없는 이벤트는 조용히 버린다.
        PII 키 이름을 가진 파라미터도 버린다.

        부분 수락이다. 일부 이벤트가 거부되어도 200을 반환한다.
      operationId: ingestEvents
      security: []
      parameters:
        - $ref: '#/components/parameters/SeoriApp'
        - $ref: '#/components/parameters/SeoriSdk'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                context:
                  $ref: '#/components/schemas/EventContext'
                events:
                  type: array
                  minItems: 1
                  maxItems: 25
                  items:
                    $ref: '#/components/schemas/ClientEvent'
      responses:
        '200':
          description: 수집됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result:
                        type: object
                        required: [accepted, dropped]
                        properties:
                          accepted: { type: integer }
                          dropped: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /users/me:
    delete:
      tags: [user]
      summary: 플랫폼 사용자 삭제
      description: |
        앱이 계정을 삭제할 때 호출한다.
        PII를 저장하지 않더라도 삭제 경로는 있어야 한다.

        **IAP 원장 문서는 삭제하지 않는다.** 소유자 참조만 끊는다.
      operationId: deleteCurrentUser
      responses:
        '200':
          description: 삭제됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result:
                        type: object
                        properties:
                          deleted: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # 마켓별 엔드포인트를 두지 않는다. 증빙 필드 이름도 마켓마다 다르지
  # 않고 token 하나다. 마켓이 늘 때마다 경로와 필드가 늘면 SDK가 마켓
  # 개수만큼 갈라지고, 그 갈라짐은 지급 여부가 걸린 자리에서 드러난다.
  /iap/verify:
    post:
      tags: [iap]
      summary: 구매 검증과 지급
      description: |
        마켓 3종을 한 엔드포인트로 받는다. `platform`이 어느 마켓인지 정한다.

        상품 유형은 서버 카탈로그가 정한다. Google Play 소모성은 지급 뒤 consume하고,
        Apple은 `CONSUMABLE` 또는 `NON_CONSUMABLE` 거래가 카탈로그 유형과 일치해야 한다.
        구독 상품은 422로 거부한다.
        **production과 sandbox 사이의 자동 fallback은 없다.**

        응답의 `granted`와 `alreadyGranted`는 항상 배타적이다. 둘 다
        false인 조합은 존재하지 않는다 — 불변식 2다.
      operationId: verifyIapPurchase
      parameters:
        - $ref: '#/components/parameters/SeoriApp'
        - $ref: '#/components/parameters/AppCheck'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, productId, token]
              additionalProperties: false
              properties:
                platform:
                  type: string
                  enum: [google_play, app_store, apps_in_toss]
                productId: { $ref: '#/components/schemas/ProductId' }
                token:
                  type: string
                  maxLength: 4096
                  description: >
                    마켓이 발급한 증빙. Play는 purchaseToken, App Store는
                    transactionId, AppsInToss는 orderId다. 소유의 근거는
                    이 토큰이다 — 마켓이 이 계정에 발급했다는 사실 자체가
                    마켓이 내린 소유 판정이다. ADR 0010 참고.
      responses:
        '200': { $ref: '#/components/responses/VerifyPurchaseOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/ProviderError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /iap/entitlements:
    get:
      tags: [iap]
      summary: entitlement 목록 조회
      description: |
        마켓 SDK가 없어도 이 엔드포인트만으로 환불 projection을 반영할 수 있다.
      operationId: listEntitlements
      parameters:
        - $ref: '#/components/parameters/SeoriApp'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    required: [result]
                    properties:
                      result:
                        type: object
                        required: [status, entitlements]
                        properties:
                          status:
                            type: string
                            enum: [verified]
                          entitlements:
                            type: array
                            items: { $ref: '#/components/schemas/EntitlementId' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /iap/account-references:
    post:
      tags: [iap]
      summary: 마켓 계정 참조 발급
      description: |
        Google과 Apple 신규 구매 전에 클라이언트가 받아 마켓 SDK에 넘긴다.

        HMAC keyring으로 생성한다. 첫 항목이 현재 키이고 나머지는 회전 검증용이다.
      operationId: getAccountReferences
      parameters:
        - $ref: '#/components/parameters/SeoriApp'
      responses:
        '200':
          description: 발급 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result:
                        type: object
                        required: [googlePlayObfuscatedAccountId, appStoreAppAccountToken]
                        properties:
                          googlePlayObfuscatedAccountId:
                            type: string
                          appStoreAppAccountToken:
                            type: string
                            format: uuid
        '401': { $ref: '#/components/responses/Unauthorized' }

  # 실제 라우트는 /v1/iap/webhooks/apple 이다. App Store Connect의 알림
  # URL에 이 값을 그대로 등록한다. 경로가 틀리면 404가 나고 환불·취소
  # 알림이 유실된다 — 마켓은 우리 원장을 대신 지켜주지 않는다.
  /iap/webhooks/apple:
    post:
      tags: [webhook]
      summary: App Store Server Notification v2 수신
      description: |
        **인증이 곧 JWS 서명 검증이다.** 별도 토큰이 없다.

        처리 대상은 ONE_TIME_CHARGE, REFUND, REFUND_DECLINED, REFUND_REVERSED, REVOKE.
        그 외는 무시한다.

        **알림만으로 신규 지급을 하지 않는다.** 기존 소유자의 상태만 재조정한다.
      operationId: receiveAppStoreNotification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signedPayload]
              additionalProperties: false
              properties:
                signedPayload:
                  type: string
      responses:
        '200':
          description: 처리 또는 무시
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/WebhookOutcome'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # 실제 라우트는 /v1/iap/webhooks/play 다. Pub/Sub push subscription의
  # push endpoint에 이 값을 등록한다.
  /iap/webhooks/play:
    post:
      tags: [webhook]
      summary: Google Play RTDN 수신
      description: |
        Pub/Sub push subscription. OIDC 토큰으로 인증한다.

        topic은 `play-iap-rtdn` 고정이다. "goog" prefix가 금지되어 이 이름이어야 한다.

        부분환불은 지원하지 않고 422로 거부한다.
        pendingRefundReview는 원장에 기록만 하고 자동 응답하지 않는다.
      operationId: receiveGooglePlayRtdn
      security:
        - PubSubOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: object
                  required: [data, messageId]
                  properties:
                    data: { type: string, format: byte }
                    messageId: { type: string }
                    publishTime: { type: string, format: date-time }
                subscription: { type: string }
      responses:
        '200':
          description: 처리 또는 무시
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/WebhookOutcome'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /iap/webhooks/apple/{appId}:
    post:
      tags: [webhook]
      summary: 앱 범위 App Store Server Notification v2 수신
      description: |
        신규 앱용 고정 appId 경로다. composition root가 registry의 appId와
        bundle ID, verifier, 앱 범위 원장을 결합하며 payload의 bundle ID도 다시 검증한다.
        기존 `/iap/webhooks/apple` 계약은 lizard-tycoon 호환을 위해 유지한다.
      operationId: receiveAppStoreNotificationForApp
      security: []
      parameters:
        - name: appId
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signedPayload]
              additionalProperties: false
              properties:
                signedPayload: { type: string }
      responses:
        '200':
          description: 처리 또는 무시
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/WebhookOutcome' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /iap/webhooks/play/{appId}:
    post:
      tags: [webhook]
      summary: 앱 범위 Google Play RTDN 수신
      description: |
        신규 앱용 고정 appId 경로다. composition root가 registry의 appId와
        package name, verifier, 앱 범위 원장을 결합하며 RTDN package name도 다시 검증한다.
        기존 `/iap/webhooks/play` 계약은 lizard-tycoon 호환을 위해 유지한다.
      operationId: receiveGooglePlayRtdnForApp
      security:
        - PubSubOidc: []
      parameters:
        - name: appId
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: object
                  required: [data, messageId]
                  properties:
                    data: { type: string, format: byte }
                    messageId: { type: string }
                    publishTime: { type: string, format: date-time }
                subscription: { type: string }
      responses:
        '200':
          description: 처리 또는 무시
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/WebhookOutcome' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/health:
    get:
      tags: [admin]
      summary: 플랫폼 운영 상태 조회
      operationId: getAdminHealth
      security: [{ AdminOidc: [] }]
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    required: [result]
                    properties:
                      result:
                        $ref: '#/components/schemas/AdminHealth'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/metrics:
    get:
      tags: [admin]
      summary: 플랫폼 사용자 규모 지표 조회
      description: |
        앱을 가로지르는 플랫폼 전체 사용자 규모다. 앱별 제품 지표가 아니다.

        **원장 환경과 무관하다.** `users` 컬렉션은 identity가 소유하고
        sandbox/production 원장 prefix를 타지 않으므로, 이 값은 sandbox
        원장을 보고 있을 때도 같은 배포 환경 전체를 센다.

        활성 사용자는 `lastSeenAt` 기준이고 `lastSeenAt`은 세션 발급과
        갱신에서만 갱신된다. 따라서 앱을 열었지만 토큰이 아직 유효해
        재발급이 없었던 사용자는 세지 않는다. GA4 DAU와 정의가 다르다.
      operationId: getAdminMetrics
      security: [{ AdminOidc: [] }]
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    required: [result]
                    properties:
                      result:
                        $ref: '#/components/schemas/AdminUserMetrics'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/orders/recent:
    get:
      tags: [admin]
      summary: 최근 IAP 주문 조회
      description: |
        계약 형식을 만족하지 않는 주문은 목록에서 제외하고 `hiddenOrderCount`로
        건수만 알린다. 건수가 0이 아니면 이 목록은 불완전하므로 화면이 반드시
        표시해야 한다.
      operationId: listAdminRecentOrders
      security: [{ AdminOidc: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminLimit'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    required: [result]
                    properties:
                      result:
                        type: object
                        required: [orders, hiddenOrderCount]
                        properties:
                          orders:
                            type: array
                            items: { $ref: '#/components/schemas/AdminOrder' }
                          hiddenOrderCount:
                            type: integer
                            minimum: 0
                            description: 계약 위반으로 제외된 주문 수
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/users/{reference}:
    get:
      tags: [admin]
      summary: PII 없는 플랫폼 사용자 조회
      description: |
        `platformUserId` 또는 정확한 `supportCode`로만 조회한다.
        이메일, 이름, 전화번호, 앱 사용자 식별자는 반환하지 않는다.
      operationId: getAdminUser
      security: [{ AdminOidc: [] }]
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            oneOf:
              - { type: string, pattern: '^pu_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
              - { type: string, pattern: '^[A-Z]{1,3}-[0-9A-HJKMNP-TV-Z]{8}$' }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    required: [result]
                    properties:
                      result:
                        type: object
                        required: [user]
                        properties:
                          user: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/users/{puid}/entitlements:
    get:
      tags: [admin]
      summary: 사용자 entitlement 전체 조회
      description: 활성 여부와 무관하게 source를 포함해 반환한다.
      operationId: listAdminUserEntitlements
      security: [{ AdminOidc: [] }]
      parameters:
        - name: puid
          in: path
          required: true
          schema: { type: string, pattern: '^pu_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    required: [result]
                    properties:
                      result:
                        type: object
                        required: [platformUserId, entitlements]
                        properties:
                          platformUserId: { type: string }
                          entitlements:
                            type: array
                            items: { $ref: '#/components/schemas/AdminEntitlement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/operator-grants:
    get:
      tags: [admin]
      summary: 운영자 지급과 회수 이력 조회
      description: |
        계약 형식을 만족하지 않는 레코드는 목록에서 제외하고 `hidden*Count`로
        건수만 알린다. 자유 서술 reason이나 이메일 원문 actor 같은 값이
        브라우저로 나가지 않게 하면서도, 목록 하나가 통째로 막히지 않게 한다.

        **건수가 0이 아니면 이 목록은 불완전하다.** 감사 이력이라 조용히
        누락되면 운영자가 잘못된 결론을 내릴 수 있으므로 화면은 이 값을
        반드시 표시해야 한다.
      operationId: listAdminOperatorGrants
      security: [{ AdminOidc: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminLimit'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    required: [result]
                    properties:
                      result:
                        type: object
                        required:
                          [grants, revocations, hiddenGrantCount, hiddenRevocationCount]
                        properties:
                          grants:
                            type: array
                            items: { $ref: '#/components/schemas/AdminOperatorRecord' }
                          revocations:
                            type: array
                            items: { $ref: '#/components/schemas/AdminOperatorRecord' }
                          hiddenGrantCount:
                            type: integer
                            minimum: 0
                            description: 계약 위반으로 제외된 지급 기록 수
                          hiddenRevocationCount:
                            type: integer
                            minimum: 0
                            description: 계약 위반으로 제외된 회수 기록 수
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/apps/{appId}/iap/catalog:
    get:
      tags: [admin]
      summary: 앱별 관리 가능 entitlement ID 목록 조회
      description: 전역 SKU 카탈로그와 앱 레지스트리 allowlist의 교집합만 반환한다.
      operationId: getAdminAppIapCatalog
      security: [{ AdminOidc: [] }]
      parameters:
        - name: appId
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    required: [result]
                    properties:
                      result:
                        type: object
                        required: [appId, entitlements]
                        additionalProperties: false
                        properties:
                          appId: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
                          entitlements:
                            type: array
                            items: { $ref: '#/components/schemas/EntitlementId' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/apps/{appId}/iap/refund-reviews:
    get:
      tags: [admin]
      summary: Google Play 환불 검토 queue 조회
      description: |
        read allowlist 전용이다. `orderId`, `pendingRefundToken`, ciphertext,
        PUID와 마켓 계정 참조는 반환하지 않는다.
      operationId: listAdminGooglePlayRefundReviews
      security: [{ AdminOidc: [] }]
      parameters:
        - name: appId
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
        - name: state
          in: query
          required: false
          schema: { $ref: '#/components/schemas/RefundReviewState' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    required: [result]
                    properties:
                      result:
                        type: object
                        required: [appId, environment, refundReviews]
                        additionalProperties: false
                        properties:
                          appId: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
                          environment: { $ref: '#/components/schemas/LedgerEnvironment' }
                          refundReviews:
                            type: array
                            items: { $ref: '#/components/schemas/AdminRefundReview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/apps/{appId}/iap/refund-reviews/{reviewId}/decision:
    post:
      tags: [admin]
      summary: Google Play 환불 검토 의견 확정
      description: |
        write allowlist 전용이다. 결정과 immutable request record를 같은
        Firestore transaction으로 먼저 확정하고, worker가 Google에 제출한다.
        Google은 첫 API 호출만 판단에 사용하므로 이미 확정된 의견은 수정할 수 없다.
      operationId: decideAdminGooglePlayRefundReview
      security: [{ AdminOidc: [] }]
      parameters:
        - name: appId
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
        - name: reviewId
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
        - $ref: '#/components/parameters/AdminActor'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminRefundReviewDecisionRequest' }
      responses:
        '202':
          description: 결정이 원장에 확정되어 worker 제출 대기 중
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    required: [result]
                    properties:
                      result: { $ref: '#/components/schemas/AdminRefundReviewDecisionResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/entitlements/grant:
    post:
      tags: [admin]
      summary: 운영자 entitlement 지급
      description: |
        write allowlist 전용이다. 서버가 앱, 사용자 소속, 원장 환경, 카탈로그와
        typed confirmation을 모두 검증한 뒤 원장과 감사 레코드를 한 트랜잭션으로 쓴다.
      operationId: grantAdminEntitlement
      security: [{ AdminOidc: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminActor'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminGrantRequest' }
      responses:
        '200': { $ref: '#/components/responses/AdminGrantMutationOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/entitlements/revoke:
    post:
      tags: [admin]
      summary: 운영자 지급 source 회수
      description: |
        `grantRequestId`로 지정한 operator source만 revoked로 바꾼다.
        Google Play, App Store, AppsInToss source는 절대 변경하지 않는다.
      operationId: revokeAdminEntitlement
      security: [{ AdminOidc: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminActor'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminRevokeRequest' }
      responses:
        '200': { $ref: '#/components/responses/AdminRevokeMutationOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/iap/sandbox-reset:
    post:
      tags: [admin]
      summary: App Store sandbox 원장 초기화
      description: |
        App Store Connect에서 구매 내역을 지운 뒤 sandbox 원장에만 반영한다.

        첫 트랜잭션에서 immutable reset intent와 사용자 barrier를 함께 확정한
        시점이 요청 시작의 선형화 지점이다. 이 뒤 처리 실패는
        `sandbox_reset_pending`이며 새 requestId를 만들지 말고 같은 requestId로
        이 요청을 재호출하거나 resume API를 호출해야 한다.

        같은 requestId가 `closed_not_started`로 영구 종결됐다면
        `sandbox_reset_closed`로 거부하고 새 intent를 만들지 않는다.
      operationId: resetAdminAppStoreSandbox
      security: [{ AdminOidc: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminActor'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSandboxResetRequest' }
      responses:
        '200': { $ref: '#/components/responses/AdminSandboxResetMutationOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SandboxResetConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/SandboxResetUnavailable' }

  /admin/iap/sandbox-resets/{requestId}:
    get:
      tags: [admin]
      summary: App Store sandbox 초기화 상태 조회
      description: |
        영구 reset intent나 not-started closure가 없으면 `sandbox_reset_not_found`를 반환한다.
        HTTP 응답에는 platformUserId와 resetOrderKeys를 노출하지 않는다.
      operationId: getAdminAppStoreSandboxReset
      security: [{ AdminOidc: [] }]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }
      responses:
        '200':
          description: 상태 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    required: [result]
                    properties:
                      result:
                        $ref: '#/components/schemas/AdminSandboxResetStatusResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/SandboxResetNotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/iap/sandbox-resets/{requestId}/resume:
    post:
      tags: [admin]
      summary: 준비 상태의 App Store sandbox 초기화 재개
      description: |
        첫 트랜잭션에서 영구 확정됐지만 완료되지 않은 reset intent를 재개한다.
        `completed` 상태의 같은 요청은 저장된 결과를 멱등 반환한다.
        `closed_not_started` 상태는 `sandbox_reset_closed`로 거부한다.
        새 reset intent를 만들거나 mutable 앱·사용자 precondition을 다시 평가하지 않는다.
      operationId: resumeAdminAppStoreSandboxReset
      security: [{ AdminOidc: [] }]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }
        - $ref: '#/components/parameters/AdminActor'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSandboxResetResumeRequest' }
      responses:
        '200': { $ref: '#/components/responses/AdminSandboxResetMutationOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/SandboxResetNotFound' }
        '409': { $ref: '#/components/responses/SandboxResetResumeConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/SandboxResetPending' }

  /admin/iap/sandbox-resets/{requestId}/close-not-started:
    post:
      tags: [admin]
      summary: 시작되지 않은 App Store sandbox 초기화 영구 종결
      description: |
        상태 조회에서 durable intent가 없음을 확인한 requestId를 영구 종결한다.
        closure가 먼저 commit되면 같은 requestId로 reset intent를 나중에 만들 수 없다.
        같은 appId의 exact closure 재호출은 `applied=false`로 멱등 반환한다.
      operationId: closeAdminAppStoreSandboxResetNotStarted
      security: [{ AdminOidc: [] }]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }
        - $ref: '#/components/parameters/AdminActor'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSandboxResetCloseNotStartedRequest' }
      responses:
        '200': { $ref: '#/components/responses/AdminSandboxResetCloseNotStartedOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/SandboxResetCloseConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/config/maintenance:
    post:
      tags: [admin]
      summary: 앱 점검 모드 변경
      operationId: setAdminMaintenance
      security: [{ AdminOidc: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminActor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appId, minutes]
              additionalProperties: false
              properties:
                appId: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
                minutes: { type: integer, minimum: 0, maximum: 1440 }
      responses:
        '200':
          description: 변경 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    required: [result]
                    properties:
                      result:
                        type: object
                        required: [appId, active, minutes]
                        additionalProperties: false
                        properties:
                          appId: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
                          active: { type: boolean }
                          minutes: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /ads/policy:
    get:
      tags: [ads]
      summary: 현재 사용자의 광고 정책 조회
      operationId: getAdsPolicy
      parameters: [{ $ref: '#/components/parameters/SeoriApp' }]
      responses:
        '200':
          description: 정책 조회 성공
          content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/EnvelopeOk' }, { type: object, properties: { result: { $ref: '#/components/schemas/AdsPolicy' } } }] } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /ads/reward-claims:
    post:
      tags: [ads]
      summary: 보상 광고 claim 생성
      operationId: createAdRewardClaim
      parameters: [{ $ref: '#/components/parameters/SeoriApp' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateAdRewardClaimRequest' } } } }
      responses:
        '201': { description: 생성 또는 동일 requestId 결과, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/EnvelopeOk' }, { type: object, properties: { result: { $ref: '#/components/schemas/AdRewardClaim' } } }] } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /ads/reward-claims/{claimId}:
    get:
      tags: [ads]
      summary: 본인 보상 claim 조회
      operationId: getAdRewardClaim
      parameters:
        - { $ref: '#/components/parameters/SeoriApp' }
        - { name: claimId, in: path, required: true, schema: { type: string, pattern: '^cl_[0-9a-f-]{36}$' } }
      responses:
        '200': { description: 조회 성공, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/EnvelopeOk' }, { type: object, properties: { result: { $ref: '#/components/schemas/AdRewardClaim' } } }] } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /ads/reward-claims/{claimId}/confirm:
    post:
      tags: [ads]
      summary: AppsInToss 클라이언트 보상 확인
      description: AppsInToss claim만 client_confirmed로 전이한다. server_verified로 승격하지 않는다.
      operationId: confirmAdRewardClaim
      parameters:
        - { $ref: '#/components/parameters/SeoriApp' }
        - { name: claimId, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [transactionId], additionalProperties: false, properties: { transactionId: { type: string, maxLength: 256 } } } } } }
      responses:
        '200': { description: 확인 성공, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/EnvelopeOk' }, { type: object, properties: { result: { $ref: '#/components/schemas/AdRewardClaim' } } }] } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /ads/reward-claims/{claimId}/ack:
    post:
      tags: [ads]
      summary: 앱 로컬 보상 정산 완료 기록
      operationId: acknowledgeAdRewardClaim
      parameters:
        - { $ref: '#/components/parameters/SeoriApp' }
        - { name: claimId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: delivered 전이 또는 멱등 성공, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/EnvelopeOk' }, { type: object, properties: { result: { $ref: '#/components/schemas/AdRewardClaim' } } }] } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /ads/admob/ssv/{appId}:
    get:
      tags: [ads]
      summary: AdMob server-side verification callback
      operationId: confirmAdMobSsv
      security: []
      parameters:
        - { name: appId, in: path, required: true, schema: { type: string } }
        - { name: signature, in: query, required: true, schema: { type: string } }
        - { name: key_id, in: query, required: true, schema: { type: string } }
        - { name: custom_data, in: query, required: true, schema: { type: string } }
        - { name: user_id, in: query, required: true, schema: { type: string } }
        - { name: transaction_id, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: 서명 검증과 claim 확인 성공 또는 Google probe }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/ads/health:
    get:
      tags: [admin, ads]
      summary: Ads 서비스 운영 상태
      security: [{ AdminOidc: [] }]
      responses:
        '200':
          description: 상태 조회 성공
          content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/EnvelopeOk' }, { type: object, required: [result], properties: { result: { $ref: '#/components/schemas/AdminAdsHealth' } } }] } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/apps/{appId}/ads/config:
    get:
      tags: [admin, ads]
      summary: 앱 광고 레지스트리 설정 조회
      security: [{ AdminOidc: [] }]
      parameters: [{ name: appId, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: suffix만 포함한 읽기 전용 설정
          content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/EnvelopeOk' }, { type: object, required: [result], properties: { result: { $ref: '#/components/schemas/AdminAdsConfig' } } }] } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/apps/{appId}/ads/health:
    get:
      tags: [admin, ads]
      summary: 앱별 SSV와 광고 정책 상태 조회
      security: [{ AdminOidc: [] }]
      parameters: [{ name: appId, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Google probe와 실제 callback을 구분한 앱별 상태
          content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/EnvelopeOk' }, { type: object, required: [result], properties: { result: { $ref: '#/components/schemas/AdminAppAdsHealth' } } }] } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/{puid}/ads:
    get:
      tags: [admin, ads]
      summary: 사용자 광고 정책과 감사 이력
      security: [{ AdminOidc: [] }]
      parameters: [{ name: puid, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: PII 없는 광고 정책
          content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/EnvelopeOk' }, { type: object, required: [result], properties: { result: { $ref: '#/components/schemas/AdminUserAds' } } }] } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/ads/reward-claims:
    get:
      tags: [admin, ads]
      summary: 보상 claim 진단 목록
      security: [{ AdminOidc: [] }]
      parameters:
        - { name: appId, in: query, schema: { type: string } }
        - { name: provider, in: query, schema: { type: string, enum: [admob, apps_in_toss] } }
        - { name: state, in: query, schema: { type: string, enum: [accepted, confirmed, delivered, expired] } }
        - { name: assurance, in: query, schema: { type: string, enum: [pending, server_verified, client_confirmed] } }
        - { name: placement, in: query, schema: { type: string } }
        - { name: reference, in: query, description: 정확한 supportCode 또는 claim ID, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: 원문 transaction과 사용자 식별자를 제외한 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    required: [result]
                    properties:
                      result:
                        type: object
                        required: [claims]
                        additionalProperties: false
                        properties:
                          claims: { type: array, items: { $ref: '#/components/schemas/AdRewardClaim' } }

  /admin/ads/suppressions/grant:
    post:
      tags: [admin, ads]
      summary: 운영자 광고 차단 추가
      security: [{ AdminOidc: [] }]
      parameters: [{ $ref: '#/components/parameters/AdminActor' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminAdsSuppressionRequest' } } } }
      responses:
        '200': { description: 반영 또는 이미 active인 멱등 성공, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/EnvelopeOk' }, { type: object, required: [result], properties: { result: { $ref: '#/components/schemas/AdminAdsSuppressionResult' } } }] } } } }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/ads/suppressions/revoke:
    post:
      tags: [admin, ads]
      summary: 운영자 광고 차단 회수
      security: [{ AdminOidc: [] }]
      parameters: [{ $ref: '#/components/parameters/AdminActor' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminAdsSuppressionRequest' } } } }
      responses:
        '200': { description: 회수 또는 동일 requestId 멱등 성공, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/EnvelopeOk' }, { type: object, required: [result], properties: { result: { $ref: '#/components/schemas/AdminAdsSuppressionResult' } } }] } } } }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    PlatformToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '`/auth/session`이 발급한 플랫폼 세션 토큰'
    PresenceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '`/presence/token`이 발급한 Edge 전용 Ed25519 token'
    PubSubOidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Pub/Sub push subscription이 붙이는 Google OIDC 토큰
    AdminOidc:
      type: http
      scheme: bearer
      bearerFormat: Google OIDC ID token
      description: |
        Cloud Run Admin audience를 대상으로 발급한 Google OIDC ID token.
        GET은 read 또는 write allowlist, mutation은 write allowlist만 허용한다.

  parameters:
    SeoriApp:
      name: X-Seori-App
      in: header
      required: true
      description: |
        앱 식별자. **권한이 아니라 어느 프로젝트로 검증할지 고르는 힌트다.**
        헤더를 바꿔도 토큰의 aud 불일치로 거부된다.
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
    SeoriSdk:
      name: X-Seori-Sdk
      in: header
      description: 'SDK 종류와 버전. 예 `gd/0.3.1`, `ts/0.3.1`. 구버전 트래픽 관측에 쓴다'
      schema: { type: string, maxLength: 32 }
    SeoriRuntime:
      name: X-Seori-Runtime
      in: header
      description: '`godot-native-android`, `godot-web-ait`, `rn-ios`, `ait-rn`, `web`'
      schema: { type: string, maxLength: 32 }
    SeoriAppVer:
      name: X-Seori-AppVer
      in: header
      description: 앱 버전. RemoteConfig 타겟팅에 쓴다
      schema: { type: string, maxLength: 32 }
    AppCheck:
      name: X-Firebase-AppCheck
      in: header
      description: |
        레지스트리 `require_app_check`가 true인 앱에서 필수다.
        `features.content=true`인 앱은 레지스트리 검증 단계에서 이 값을 반드시 true로
        강제하므로 모든 콘텐츠 요청에 유효한 token이 필요하다.
      schema: { type: string }
    ContentAppCheck:
      name: X-Firebase-AppCheck
      in: header
      required: true
      description: 보호 콘텐츠 경로에서 매 요청 검증하는 Firebase App Check token
      schema: { type: string, minLength: 1 }
    AdminLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    AdminActor:
      name: X-Seori-Actor
      in: header
      required: false
      description: |
        작업을 승인한 GitHub login. 권한 판단에는 쓰지 않으며 형식만 검증한다.
        없거나 형식이 다르면 OIDC principal의 SHA-256 참조를 저장한다.
        grant, revoke, 최초 sandbox reset POST와 close-not-started의 멱등 payload
        일부이므로 unknown 결과를 같은 원 endpoint로 재시도할 때는 최초 값을 그대로
        보내야 한다. reset resume는 저장된 최초 payload를 사용한다.
      schema:
        type: string
        pattern: '^[A-Za-z0-9-]{1,39}$'

  schemas:
    EnvelopeOk:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]

    EnvelopeError:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: snake_case 에러 코드. 전체 목록은 docs/03-architecture/iap.md
              example: purchase_owned_by_another_user
            message:
              type: string
              description: 한국어 메시지. 클라이언트가 이 문자열로 분기하지 않는다

    ClientPlatform:
      type: string
      enum: [android, ios, web, ait]

    ContentVersionId:
      type: string
      pattern: '^sha256-[a-f0-9]{64}$'

    ContentVersion:
      type: object
      additionalProperties: false
      required: [schemaVersion, contentVersion]
      properties:
        schemaVersion: { type: integer, minimum: 1 }
        contentVersion: { $ref: '#/components/schemas/ContentVersionId' }

    ContentAccess:
      type: string
      enum: [free, deep]

    ContentArticle:
      type: object
      additionalProperties: false
      required: [id, text, access]
      properties:
        id: { type: string, pattern: '^[a-z0-9가-힣][a-z0-9가-힣._-]{0,127}$' }
        text: { type: string, minLength: 1, maxLength: 16384 }
        access: { $ref: '#/components/schemas/ContentAccess' }

    GanjiFact:
      type: string
      pattern: '^[甲乙丙丁戊己庚辛壬癸][子丑寅卯辰巳午未申酉戌亥]$'

    SipseongFact:
      type: string
      enum: [bigyeon, geopjae, siksin, sanggwan, pyeonjae, jeongjae, pyeongwan, jeonggwan, pyeonin, jeongin]

    UnseongFact:
      type: string
      enum: [jangsaeng, mogyok, gwandae, geonrok, jewang, soe, byeong, sa, myo, jeol, tae, yang]

    OhaengStateFact:
      type: string
      enum: [과다, 보통, 부족]

    SinsalNameFact:
      type: string
      enum:
        - amrok
        - baekho_daesal
        - banan
        - biin
        - cheondeok_gwiin
        - cheondeok_hap
        - cheoneul_gwiin
        - cheonsa
        - cheonsal
        - cheonui_seong
        - eumyang_chachak
        - gasuk
        - geonrok
        - geopsal
        - geumyeo
        - geupgak
        - goegang
        - gongmang
        - goran
        - gosin
        - gugin_gwiin
        - gwangwi_hakgwan
        - gwimun_gwansal
        - gyeokgak
        - hakdang_gwiin
        - hongyeom
        - hwagae
        - hyeonchim
        - jaesal
        - jangseong
        - jisal
        - mangsin
        - muncheong_gwiin
        - mungok_gwiin
        - nakjeong_gwansal
        - nyeonsal_dohwa
        - samgi_gwiin
        - sipak_daepae
        - taegeuk_gwiin
        - woldeok_gwiin
        - woldeok_hap
        - wolsal
        - wonjin
        - yangin
        - yeokma
        - yukhae

    FlowContentFact:
      type: object
      additionalProperties: false
      required: [sipseong, state]
      properties:
        sipseong: { $ref: '#/components/schemas/SipseongFact' }
        state: { $ref: '#/components/schemas/OhaengStateFact' }

    ResolveContentReadingRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, reading, scope]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        reading: { $ref: '#/components/schemas/DerivedReadingFacts' }
        scope:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { type: string, enum: [base, seun, wolun] }
        unlock:
          oneOf:
            - $ref: '#/components/schemas/RewardClaimContentUnlock'
            - $ref: '#/components/schemas/TicketContentUnlock'

    RewardClaimContentUnlock:
      type: object
      additionalProperties: false
      required: [section, kind, claimId]
      properties:
        section: { type: string, enum: [seun, wolun] }
        kind: { type: string, enum: [reward_claim] }
        claimId: { type: string, pattern: '^cl_[A-Za-z0-9._-]{1,128}$' }

    TicketContentUnlock:
      type: object
      additionalProperties: false
      required: [section, kind]
      properties:
        section: { type: string, enum: [seun, wolun] }
        kind: { type: string, enum: [ticket] }

    DerivedReadingFacts:
      type: object
      additionalProperties: false
      required: [kind, chart, ilju, johap, sinsal, relations, daeun, seun, wolun]
      properties:
        kind: { type: string, enum: [full, three_pillar] }
        chart:
          type: object
          additionalProperties: false
          required: [year, month, day]
          properties:
            year: { $ref: '#/components/schemas/GanjiFact' }
            month: { $ref: '#/components/schemas/GanjiFact' }
            day: { $ref: '#/components/schemas/GanjiFact' }
            hour: { $ref: '#/components/schemas/GanjiFact' }
        ilju: { type: string, pattern: '^(gap|eul|byeong|jeong|mu|gi|gyeong|sin|im|gye)(ja|chuk|in|myo|jin|sa|o|mi|shin|yu|sul|hae)$' }
        johap:
          type: array
          minItems: 3
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [sipseong, unseong]
            properties:
              sipseong: { $ref: '#/components/schemas/SipseongFact' }
              unseong: { $ref: '#/components/schemas/UnseongFact' }
        sinsal:
          description: 시각 미상 three_pillar 명식에서는 빈 배열이어야 한다.
          type: array
          maxItems: 24
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: { $ref: '#/components/schemas/SinsalNameFact' }
              variant: { type: string, enum: [nyeonju, wolju, ilju, siju, outer] }
        relations:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [kind]
            properties:
              kind: { type: string, enum: [yukhap, samhap, banghap, chung, hyeong, jahyeong, pa, hae, wonjin, gwimun] }
              pair: { type: string, pattern: '^[子丑寅卯辰巳午未申酉戌亥]{2}$' }
        daeun:
          type: array
          minItems: 1
          maxItems: 2
          items: { $ref: '#/components/schemas/FlowContentFact' }
        seun:
          type: object
          additionalProperties: false
          required: [year, flow, daeunSipseong]
          properties:
            year: { type: integer, minimum: 1900, maximum: 2200 }
            flow: { $ref: '#/components/schemas/FlowContentFact' }
            daeunSipseong:
              type: array
              minItems: 1
              maxItems: 2
              items: { $ref: '#/components/schemas/SipseongFact' }
            samjae: { type: string, enum: [in, mid, out] }
        wolun:
          type: array
          minItems: 12
          maxItems: 12
          items: { $ref: '#/components/schemas/FlowContentFact' }

    ResolvedContentReading:
      type: object
      additionalProperties: false
      required: [schemaVersion, contentVersion, readingKey, articles, locked]
      properties:
        schemaVersion: { type: integer, minimum: 1 }
        contentVersion: { $ref: '#/components/schemas/ContentVersionId' }
        readingKey: { type: string, pattern: '^rk_[a-f0-9]{64}$' }
        articles:
          type: array
          items: { $ref: '#/components/schemas/ContentArticle' }
        locked:
          type: array
          maxItems: 2
          items:
            type: object
            additionalProperties: false
            required: [deepKey, section, year]
            properties:
              deepKey: { type: string, pattern: '^flow:[0-9]{4}$' }
              section: { type: string, enum: [seun, wolun] }
              year: { type: integer, minimum: 1900, maximum: 2200 }

    ProductId:
      type: string
      maxLength: 128
      pattern: '^[A-Za-z0-9._-]{1,128}$'

    EntitlementId:
      type: string
      maxLength: 128
      pattern: '^[A-Za-z0-9._-]{1,128}$'

    CreateSessionRequest:
      type: object
      required: [appId, credential]
      additionalProperties: false
      properties:
        appId:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
        credential:
          type: object
          required: [kind, value]
          additionalProperties: false
          properties:
            kind:
              type: string
              enum: [firebase-id-token, ait-login, anonymous]
              description: |
                **anonymous는 사칭 가능한 신원이다.**
                RemoteConfig 조회와 이벤트 로그만 허용하고 IAP는 금지한다.
            value:
              type: string
              maxLength: 4096
            referrer:
              type: string
              enum: [DEFAULT, SANDBOX]
              description: ait-login에서만 필수인 appLogin referrer

    CreatePresenceTokenRequest:
      type: object
      required: [sessionId, platform]
      additionalProperties: false
      properties:
        sessionId:
          type: string
          minLength: 16
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
          description: 클라이언트 실행마다 새로 만드는 비식별 난수. 서버는 SHA-256만 token에 넣는다
        platform:
          $ref: '#/components/schemas/ClientPlatform'
        appVersion:
          type: string
          maxLength: 32

    PresenceBootstrap:
      type: object
      required: [enabled, heartbeatIntervalSeconds]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        token:
          type: string
          description: enabled=true일 때만 존재하는 Edge 전용 token
        expiresAt: { type: string, format: date-time }
        expiresIn:
          type: integer
          minimum: 1
          description: token 수명 초. 기기 wall clock이 틀려도 갱신 시점을 잡기 위한 값
        edgeUrl: { type: string, format: uri, example: 'https://edge.vzyx.xyz' }
        heartbeatIntervalSeconds: { type: integer, minimum: 60, maximum: 300 }

    PresenceHeartbeatRequest:
      type: object
      required: [version, sequence, platform]
      additionalProperties: false
      properties:
        version: { type: integer, enum: [1] }
        sequence: { type: integer, minimum: 0 }
        platform:
          $ref: '#/components/schemas/ClientPlatform'
        appVersion:
          type: string
          maxLength: 32

    AdsPolicy:
      type: object
      required: [appUsesAds, adsEnabled, disabledBy, checkedAt]
      additionalProperties: false
      properties:
        appUsesAds: { type: boolean }
        adsEnabled: { type: boolean }
        disabledBy: { type: array, items: { type: string, enum: [operator, ad_free] } }
        checkedAt: { type: string, format: date-time }

    AdReward:
      type: object
      required: [key, amount]
      additionalProperties: false
      properties:
        key: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,127}$' }
        amount: { type: integer, minimum: 1 }

    CreateAdRewardClaimRequest:
      type: object
      required: [requestId, placement, provider, clientPlatform, reward]
      additionalProperties: false
      properties:
        requestId: { type: string, maxLength: 128 }
        placement: { type: string, maxLength: 128 }
        provider: { type: string, enum: [admob, apps_in_toss] }
        clientPlatform: { type: string, enum: [android, ios, apps_in_toss] }
        reward: { $ref: '#/components/schemas/AdReward' }

    AdRewardClaim:
      type: object
      required: [claimId, appId, placement, provider, clientPlatform, reward, state, assurance, createdAt, expiresAt]
      additionalProperties: false
      properties:
        claimId: { type: string }
        appId: { type: string }
        placement: { type: string }
        provider: { type: string, enum: [admob, apps_in_toss] }
        clientPlatform: { type: string, enum: [android, ios, apps_in_toss] }
        reward: { $ref: '#/components/schemas/AdReward' }
        state: { type: string, enum: [accepted, confirmed, delivered, expired] }
        assurance: { type: string, enum: [pending, server_verified, client_confirmed] }
        createdAt: { type: string, format: date-time }
        confirmedAt: { type: string, format: date-time }
        acknowledgedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        admobSsv:
          type: object
          additionalProperties: false
          required: [customData, userId]
          properties:
            customData: { type: string }
            userId: { type: string }

    AdminAdsHealth:
      type: object
      required: [status, invalidSignatureCount, stalePendingClaimCount, policyFailureCount, checkedAt]
      additionalProperties: false
      properties:
        status: { type: string, enum: [ok] }
        lastSsvSuccessAt: { type: string, format: date-time }
        invalidSignatureCount: { type: integer, minimum: 0 }
        stalePendingClaimCount: { type: integer, minimum: 0 }
        policyFailureCount: { type: integer, minimum: 0 }
        checkedAt: { type: string, format: date-time }

    AdminAppAdsHealth:
      type: object
      required: [appId, status, invalidSignatureCount, stalePendingClaimCount, policyFailureCount, checkedAt]
      additionalProperties: false
      properties:
        appId: { type: string }
        status: { type: string, enum: [ok] }
        lastCallbackSuccessAt: { type: string, format: date-time }
        lastProbeSuccessAt: { type: string, format: date-time }
        invalidSignatureCount: { type: integer, minimum: 0 }
        stalePendingClaimCount: { type: integer, minimum: 0 }
        policyFailureCount: { type: integer, minimum: 0 }
        checkedAt: { type: string, format: date-time }

    AdminAdsProviderConfig:
      type: object
      additionalProperties: false
      properties:
        androidAdUnitSuffix: { type: string }
        iosAdUnitSuffix: { type: string }
        adGroupSuffix: { type: string }
        rewardItem: { type: string }
        rewardAmount: { type: integer, minimum: 0 }

    AdminAdsRewardRange:
      type: object
      required: [key, min_amount, max_amount]
      additionalProperties: false
      properties:
        key: { type: string }
        min_amount: { type: integer, minimum: 1 }
        max_amount: { type: integer, minimum: 1 }

    AdminAdsConfig:
      type: object
      required: [appId, providers, placements, registrySyncedAt]
      additionalProperties: false
      properties:
        appId: { type: string }
        providers: { type: array, items: { type: string, enum: [admob, apps_in_toss] } }
        registrySyncedAt: { type: string, format: date-time }
        placements:
          type: array
          items:
            type: object
            required: [id, format, providers, dailyLimit, cooldownSeconds]
            additionalProperties: false
            properties:
              id: { type: string }
              format: { type: string, enum: [rewarded, interstitial] }
              providers:
                type: object
                additionalProperties: { $ref: '#/components/schemas/AdminAdsProviderConfig' }
              reward: { $ref: '#/components/schemas/AdminAdsRewardRange' }
              dailyLimit: { type: integer, minimum: 1 }
              cooldownSeconds: { type: integer, minimum: 0 }

    AdminAdsSuppressionRecord:
      type: object
      required: [requestId, appId, platformUserId, actorLogin, reason, operation, applied, createdAt]
      additionalProperties: false
      properties:
        requestId: { type: string }
        grantRequestId: { type: string }
        appId: { type: string }
        platformUserId: { type: string }
        actorLogin: { type: string }
        reason: { $ref: '#/components/schemas/AdminMutationReason' }
        operation: { type: string, enum: [grant, revoke] }
        applied: { type: boolean }
        createdAt: { type: string, format: date-time }

    AdminUserAds:
      type: object
      required: [appId, platformUserId, supportCode, isAnonymous, authType, lastSeenAt, policy, auditHistory]
      additionalProperties: false
      properties:
        appId: { type: string }
        platformUserId: { type: string }
        supportCode: { type: string }
        isAnonymous: { type: boolean }
        authType: { type: string, enum: [firebase, firebase_bridge, apps_in_toss, anonymous] }
        lastSeenAt: { type: string, format: date-time }
        policy: { $ref: '#/components/schemas/AdsPolicy' }
        auditHistory: { type: array, items: { $ref: '#/components/schemas/AdminAdsSuppressionRecord' } }

    AdminAdsSuppressionResult:
      type: object
      required: [applied, requestId]
      additionalProperties: false
      properties:
        applied: { type: boolean }
        requestId: { type: string }
        activeGrantRequestId: { type: string }

    AdminAdsSuppressionRequest:
      type: object
      required: [requestId, appId, platformUserId, reason, confirmation]
      additionalProperties: false
      properties:
        requestId: { type: string, maxLength: 128 }
        appId: { type: string }
        platformUserId: { type: string }
        grantRequestId: { type: string, maxLength: 128 }
        reason: { $ref: '#/components/schemas/AdminMutationReason' }
        confirmation: { type: string, maxLength: 300 }

    CreateFirebaseCustomTokenRequest:
      type: object
      required: [appId]
      additionalProperties: false
      properties:
        appId:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
        existingFirebaseIdToken:
          type: string
          maxLength: 4096
          description: 기존 사용자의 uid 보존이 필요할 때만 보낸다

    FirebaseCustomToken:
      type: object
      required: [firebaseCustomToken, appUserId]
      properties:
        firebaseCustomToken:
          type: string
          description: Firebase signInWithCustomToken에 한 번 사용하고 저장하지 않는다
        appUserId:
          type: string
          minLength: 1
          maxLength: 128
          description: custom token의 Firebase uid. 기존 토큰을 보낸 경우 기존 uid와 같아야 한다

    Session:
      type: object
      required:
        [platformToken, refreshToken, platformUserId, supportCode, expiresIn, serverTimeUnix, features, sdk]
      properties:
        platformToken: { type: string }
        refreshToken: { type: string }
        platformUserId:
          type: string
          pattern: '^pu_[0-9A-HJKMNP-TV-Z]{26}$'
          description: 'pu_ + ULID. firebase_uid에서 파생하지 않는다'
        supportCode:
          type: string
          pattern: '^[A-Z]{1,3}-[0-9A-HJKMNP-TV-Z]{8}$'
          description: >
            유저가 문의에 첨부하는 식별자. 앱 설정 화면이 이 값을 보여준다.
            Firebase uid를 보여주면 CS가 그걸로 원장을 찾을 수 없다 —
            플랫폼은 앱의 uid를 조회 키로 두지 않고 PII도 저장하지 않아
            이메일 검색이 성립하지 않는다. Admin API가 이 코드로 조회한다.
        appUserId:
          type: string
          description: 앱 쪽 식별자. 디버깅용
        expiresIn:
          type: integer
          description: 초
        serverTimeUnix:
          type: integer
          format: int64
        isAnonymous:
          type: boolean
          description: true면 IAP 경로가 막힌다
        features:
          $ref: '#/components/schemas/Features'
        sdk:
          $ref: '#/components/schemas/SdkStatus'
        maintenance:
          $ref: '#/components/schemas/Maintenance'
        configEtag:
          type: string
          description: 이 값이 그대로면 /config를 호출할 필요가 없다

    Features:
      type: object
      additionalProperties:
        type: boolean
      example:
        iap: true
        events: true
        config: true

    SdkStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, deprecated, blocked]
          description: |
            **마켓 배포된 구버전 SDK를 서버에서 끄는 유일한 수단이다.**
            blocked면 SDK가 이벤트만 남기고 나머지를 정지한다.
        message: { type: string }
        updateUrl: { type: string }
        minSupportedVersion: { type: string }

    Maintenance:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
        message: { type: string }
        until: { type: string, format: date-time }

    RemoteConfig:
      type: object
      required: [values, features, sdk, maintenance]
      properties:
        values:
          type: object
          additionalProperties: true
          description: 앱별 임의 키-값. 기본값은 클라이언트 SDK에 하드코딩해 둔다
        features:
          $ref: '#/components/schemas/Features'
        sdk:
          $ref: '#/components/schemas/SdkStatus'
        maintenance:
          $ref: '#/components/schemas/Maintenance'

    ClientEvent:
      type: object
      required: [eventId, name, tsUnixMs]
      additionalProperties: false
      properties:
        eventId:
          type: string
          description: 클라이언트 생성 ULID. at-least-once라 중복 제거는 쿼리에서 한다
          maxLength: 32
        name:
          type: string
          maxLength: 40
          description: lowercase snake_case. 40자 초과는 drop
        tsUnixMs:
          type: integer
          format: int64
          description: 클라이언트 시각. 서버가 ±48시간으로 clamp한다
        sessionId:
          type: string
          maxLength: 64
        params:
          type: object
          additionalProperties: true
          description: |
            최대 25개. 정규화 규약은 spec/conformance/param-normalization.json이 정본이다.
            boolean은 1/0, NaN·Inf는 0, null은 drop, 객체·배열은 drop.
            PII 키 이름은 서버와 SDK 양쪽에서 drop한다.

    EventContext:
      type: object
      additionalProperties: false
      description: 이벤트 배치 전체에 공통인 비식별 실행 환경 정보
      properties:
        platform:
          type: string
          enum: [android, ios, web, ait]
        appVersion:
          type: string
          maxLength: 32
        locale:
          type: string
          maxLength: 16
        ga4ClientId:
          type: string
          maxLength: 64
        sdkVersion:
          type: string
          maxLength: 32

    VerifyPurchaseOutcome:
      type: object
      required: [status, entitlementId, entitlements]
      properties:
        status:
          type: string
          enum: [verified, pending, revoked]
        entitlementId:
          $ref: '#/components/schemas/EntitlementId'
        transactionId:
          type: string
          maxLength: 256
          description: |
            마켓 검증이 반환한 실제 거래 식별자. Google Play orderId,
            App Store transactionId, AppsInToss orderId다. 클라이언트가
            GA4 권장 purchase 이벤트의 transaction_id로 사용할 수 있다.
        granted:
          type: boolean
          description: |
            **granted와 alreadyGranted는 항상 배타적이다.**
            둘 다 false인 조합은 존재하지 않는다. status가 verified일 때만 존재한다.
        alreadyGranted:
          type: boolean
        entitlements:
          type: array
          items: { $ref: '#/components/schemas/EntitlementId' }
        completion:
          $ref: '#/components/schemas/Completion'
        blockedBySandboxReset:
          type: boolean
          description: sandbox 초기화로 재지급이 차단된 경우에만 존재한다

    Completion:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum:
            - none
            - retry_server_completion
            - apps_in_toss_complete_product_grant
            - app_store_sync_after_sandbox_reset
          description: |
            retry_server_completion은 **지급이 이미 커밋된 상태**를 뜻한다.
            마켓 완료 호출만 실패했고 서버 outbox가 재시도한다. 롤백하지 않는다.
        orderId:
          type: string
          description: apps_in_toss_complete_product_grant일 때만

    WebhookOutcome:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [processed, duplicate, ignored, ignored_invalid, test_notification]

    AdminHealth:
      type: object
      required:
        [environment, deadLetterCount, environmentMismatches, pendingRefundReviewCount,
         dueSoonRefundReviewCount, failedRefundReviewCount]
      additionalProperties: false
      properties:
        environment: { $ref: '#/components/schemas/LedgerEnvironment' }
        deadLetterCount: { type: integer, minimum: 0 }
        pendingRefundReviewCount:
          type: integer
          minimum: 0
          description: pending 또는 decided 상태의 미응답 검토 수
        dueSoonRefundReviewCount:
          type: integer
          minimum: 0
          description: deadline이 1시간 안인 미응답 검토 수
        failedRefundReviewCount:
          type: integer
          minimum: 0
          description: Google 제출 또는 비밀 검증이 영구 실패한 검토 수
        environmentMismatches:
          type: array
          description: |
            레지스트리가 선언한 원장 환경이 이 서비스의 환경과 다른 앱이다.
            비어 있으면 정상이며 **null이 아니라 빈 배열**을 준다.

            **비어 있지 않으면 그 앱의 운영 조작이 전부 422로 막힌다.**
            반대로 유저 결제는 계속 된다 — 환경 대조가 admin 경로에만 있고
            verify에는 없기 때문이다. 그래서 증상이 한쪽에서만 나고
            5xx나 트래픽 변화로는 잡히지 않는다.

            해소는 `registry/apps/*.json`을 고친 뒤 `cmd/regsync`를 돌리는
            것이다. 파일만 고치면 반영되지 않는다.
          items: { $ref: '#/components/schemas/AdminEnvironmentMismatch' }

    AdminEnvironmentMismatch:
      type: object
      required: [appId, registry, ledger]
      additionalProperties: false
      properties:
        appId: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
        registry:
          description: 레지스트리가 선언한 환경. 선언하지 않았으면 빈 문자열이다
          oneOf:
            - $ref: '#/components/schemas/LedgerEnvironment'
            - type: string
              enum: ['']
        ledger:
          allOf: [{ $ref: '#/components/schemas/LedgerEnvironment' }]
          description: 이 서비스가 실제로 읽고 쓰는 환경

    AdminUserMetrics:
      type: object
      required:
        [totalUsers, hourlyActiveUsers, dailyActiveUsers, weeklyActiveUsers,
         activitySource, measuredAt]
      additionalProperties: false
      properties:
        totalUsers:
          type: integer
          minimum: 0
          description: 플랫폼이 발급한 platform_user_id 총 개수
        hourlyActiveUsers:
          type: integer
          minimum: 0
          description: |
            measuredAt 기준 1시간 안에 lastSeenAt이 갱신된 사용자 수.

            시계열로 찍을 때 해상도를 주는 값이다. 24시간 롤링 값을
            1시간마다 찍으면 이웃한 두 점이 창을 23/24 공유해 곡선이
            뭉개지지만, 이 값은 창이 겹치지 않아 시간대별 굴곡이 남는다.

            세션 TTL이 1시간이라 동시 접속에 가장 가까운 근사지만
            동시 접속은 아니다. heartbeat가 없어 실제 동접은 측정하지 않는다.
        dailyActiveUsers:
          type: integer
          minimum: 0
          description: measuredAt 기준 24시간 안에 lastSeenAt이 갱신된 사용자 수
        weeklyActiveUsers:
          type: integer
          minimum: 0
          description: measuredAt 기준 7일 안에 lastSeenAt이 갱신된 사용자 수
        activitySource:
          type: string
          enum: [session_last_seen]
          description: |
            활성 판정 근거를 값으로 박아 둔다. 나중에 이벤트 기반 집계를
            추가하면 화면이 어느 정의를 보고 있는지 구분해야 하는데,
            숫자만 오면 조용히 뜻이 바뀐다.
        measuredAt:
          type: string
          format: date-time
          description: 서버가 집계 기준으로 삼은 시각

    LedgerEnvironment:
      type: string
      enum: [sandbox, production]

    AdminMutationReason:
      type: string
      description: PII나 결제 자격정보를 저장하지 않는 고정 운영 사유 코드
      enum:
        - customer_support_compensation
        - incorrect_grant_correction
        - incident_recovery
        - internal_validation

    RefundReviewState:
      type: string
      enum: [pending, decided, responded, expired, failed]

    RefundReviewPreference:
      type: string
      enum: [DECLINE, APPROVE, NEUTRAL]

    AdminRefundReviewDecisionReason:
      type: string
      description: 자유 서술과 PII를 받지 않는 환불 검토 고정 감사 사유
      enum:
        - verified_fulfillment
        - customer_refund_supported
        - insufficient_evidence
        - internal_validation

    AdminRefundReview:
      type: object
      required: [reviewId, appId, expectedEnvironment, state, refundReason, receivedAt, dueAt]
      additionalProperties: false
      properties:
        reviewId: { type: string, pattern: '^[0-9a-f]{64}$' }
        appId: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
        expectedEnvironment: { $ref: '#/components/schemas/LedgerEnvironment' }
        state: { $ref: '#/components/schemas/RefundReviewState' }
        refundReason:
          type: integer
          format: int64
          description: 미래 Google enum을 유실하지 않도록 숫자 원문을 보존한다
        receivedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
        requestId: { type: string, format: uuid }
        refundPreference: { $ref: '#/components/schemas/RefundReviewPreference' }
        sampleContentProvided: { type: boolean }
        decisionReason: { $ref: '#/components/schemas/AdminRefundReviewDecisionReason' }
        decidedAt: { type: string, format: date-time }
        respondedAt: { type: string, format: date-time }
        failedAt: { type: string, format: date-time }
        expiredAt: { type: string, format: date-time }
        lastErrorCode: { type: string, maxLength: 128 }

    AdminRefundReviewDecisionRequest:
      type: object
      required:
        [requestId, expectedEnvironment, refundPreference, sampleContentProvided, reason, confirmation]
      additionalProperties: false
      properties:
        requestId: { type: string, format: uuid }
        expectedEnvironment: { $ref: '#/components/schemas/LedgerEnvironment' }
        refundPreference: { $ref: '#/components/schemas/RefundReviewPreference' }
        sampleContentProvided:
          type: boolean
          description: 기본값 없이 운영자가 evidence를 확인하고 명시한다
        reason: { $ref: '#/components/schemas/AdminRefundReviewDecisionReason' }
        confirmation:
          type: string
          maxLength: 512
          description: '`RESPOND REFUND {appId} {reviewId} {refundPreference}`와 정확히 일치'

    AdminRefundReviewDecisionResult:
      type: object
      required:
        [applied, requestId, reviewId, appId, expectedEnvironment, state,
         refundPreference, sampleContentProvided, operation]
      additionalProperties: false
      properties:
        applied: { type: boolean }
        requestId: { type: string, format: uuid }
        reviewId: { type: string, pattern: '^[0-9a-f]{64}$' }
        appId: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
        expectedEnvironment: { $ref: '#/components/schemas/LedgerEnvironment' }
        state:
          type: string
          enum: [decided, responded, expired, failed]
        refundPreference: { $ref: '#/components/schemas/RefundReviewPreference' }
        sampleContentProvided: { type: boolean }
        operation: { type: string, enum: [refund_review_decision] }

    AdminUser:
      type: object
      required: [platformUserId, appId, supportCode, isAnonymous, authType, createdAt, lastSeenAt]
      additionalProperties: false
      properties:
        platformUserId: { type: string, pattern: '^pu_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
        appId: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
        supportCode: { type: string, pattern: '^[A-Z]{1,3}-[0-9A-HJKMNP-TV-Z]{8}$' }
        isAnonymous: { type: boolean }
        authType: { type: string, enum: [firebase, firebase_bridge, apps_in_toss, anonymous] }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }

    AdminOrder:
      type: object
      required:
        [orderKey, appId, platformUserId, entitlementId, platform, productId, state, purchasedAt, observedAt, tombstone]
      additionalProperties: false
      properties:
        orderKey: { type: string, pattern: '^[0-9a-f]{64}$' }
        appId:
          description: PII 없는 사용자 binding에서 도출. 삭제 사용자 또는 owner 없는 tombstone은 빈 문자열.
          oneOf:
            - { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
            - { type: string, enum: [''] }
        platformUserId:
          description: 일반 주문은 정확한 PUID. owner 없는 tombstone만 빈 문자열.
          oneOf:
            - { type: string, pattern: '^pu_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
            - { type: string, enum: [''] }
        entitlementId:
          description: owner 없는 tombstone만 빈 문자열.
          oneOf:
            - { $ref: '#/components/schemas/EntitlementId' }
            - { type: string, enum: [''] }
        platform: { type: string, enum: [google_play, app_store, apps_in_toss, operator] }
        productId:
          description: owner 없는 tombstone만 빈 문자열.
          oneOf:
            - { type: string, pattern: '^[A-Za-z0-9._-]{1,256}$' }
            - { type: string, enum: [''] }
        state: { type: string, enum: [active, pending, revoked, invalid] }
        purchasedAt: { type: string, format: date-time }
        observedAt: { type: string, format: date-time }
        tombstone: { type: boolean }

    AdminEntitlementSource:
      type: object
      required: [platform, productId, state, orderKey, observedAt]
      additionalProperties: false
      properties:
        platform: { type: string, enum: [google_play, app_store, apps_in_toss, operator] }
        productId: { type: string, pattern: '^[A-Za-z0-9._-]{1,256}$' }
        state: { type: string, enum: [active, pending, revoked, invalid] }
        orderKey: { type: string, pattern: '^[0-9a-f]{64}$' }
        observedAt: { type: string, format: date-time }

    AdminEntitlement:
      type: object
      required: [entitlementId, active, updatedAt, sources]
      additionalProperties: false
      properties:
        entitlementId: { $ref: '#/components/schemas/EntitlementId' }
        active: { type: boolean }
        updatedAt: { type: string, format: date-time }
        sources:
          type: array
          items: { $ref: '#/components/schemas/AdminEntitlementSource' }

    AdminOperatorRecord:
      type: object
      required: [requestId, platformUserId, entitlementId, actorLogin, reason, appId, createdAt, kind]
      additionalProperties: false
      properties:
        requestId: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }
        grantRequestId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,128}$'
          description: 회수 이력에서 대상 operator 지급 requestId. 지급 이력에서는 생략한다.
        platformUserId: { type: string, pattern: '^pu_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
        entitlementId: { $ref: '#/components/schemas/EntitlementId' }
        actorLogin:
          type: string
          pattern: '^(?:[A-Za-z0-9-]{1,39}|oidc_sha256:[0-9a-f]{64})$'
        reason: { $ref: '#/components/schemas/AdminMutationReason' }
        appId: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
        createdAt: { type: string, format: date-time }
        kind: { type: string, enum: [grant, revoke] }

    AdminGrantRequest:
      type: object
      required: [requestId, appId, platformUserId, entitlementId, reason, expectedEnvironment, confirmation]
      additionalProperties: false
      properties:
        requestId: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }
        appId: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
        platformUserId: { type: string, pattern: '^pu_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
        entitlementId: { $ref: '#/components/schemas/EntitlementId' }
        reason: { $ref: '#/components/schemas/AdminMutationReason' }
        expectedEnvironment: { $ref: '#/components/schemas/LedgerEnvironment' }
        confirmation:
          type: string
          maxLength: 512
          description: '`GRANT {appId} {platformUserId} {entitlementId}`와 정확히 일치'

    AdminRevokeRequest:
      type: object
      required:
        [requestId, grantRequestId, appId, platformUserId, entitlementId, reason, expectedEnvironment, confirmation]
      additionalProperties: false
      properties:
        requestId: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }
        grantRequestId: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }
        appId: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
        platformUserId: { type: string, pattern: '^pu_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
        entitlementId: { $ref: '#/components/schemas/EntitlementId' }
        reason: { $ref: '#/components/schemas/AdminMutationReason' }
        expectedEnvironment: { $ref: '#/components/schemas/LedgerEnvironment' }
        confirmation:
          type: string
          maxLength: 512
          description: '`REVOKE {appId} {platformUserId} {entitlementId} {grantRequestId}`와 정확히 일치'

    AdminSandboxResetRequest:
      type: object
      required:
        [requestId, appId, platformUserId, reason, expectedEnvironment, confirmation, appleClearedConfirmed]
      additionalProperties: false
      properties:
        requestId: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }
        appId: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
        platformUserId: { type: string, pattern: '^pu_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
        reason: { $ref: '#/components/schemas/AdminMutationReason' }
        expectedEnvironment:
          type: string
          enum: [sandbox]
        confirmation:
          type: string
          maxLength: 512
          description: '`RESET {appId} {platformUserId}`와 정확히 일치'
        appleClearedConfirmed: { type: boolean, enum: [true] }

    AdminSandboxResetResumeRequest:
      type: object
      required: [appId, confirmation]
      additionalProperties: false
      properties:
        appId: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
        confirmation:
          type: string
          maxLength: 512
          description: '`RESUME RESET {appId} {requestId}`와 정확히 일치'

    AdminSandboxResetCloseNotStartedRequest:
      type: object
      required: [appId, confirmation]
      additionalProperties: false
      properties:
        appId: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
        confirmation:
          type: string
          maxLength: 512
          description: '`CLOSE RESET {appId} {requestId}`와 정확히 일치'

    AdminSandboxResetMutationResult:
      type: object
      required:
        [requestId, appId, platformUserId, expectedEnvironment, operation, resetOrderKeys]
      additionalProperties: false
      properties:
        requestId: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }
        appId: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
        platformUserId: { type: string, pattern: '^pu_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
        expectedEnvironment: { type: string, enum: [sandbox] }
        operation: { type: string, enum: [sandbox_reset] }
        resetOrderKeys:
          type: array
          items: { type: string, pattern: '^[0-9a-f]{64}$' }

    AdminSandboxResetStatusResult:
      type: object
      required: [requestId, appId, expectedEnvironment, operation, state]
      additionalProperties: false
      properties:
        requestId: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }
        appId: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
        expectedEnvironment: { type: string, enum: [sandbox] }
        operation: { type: string, enum: [sandbox_reset] }
        state:
          type: string
          enum: [prepared, completed, closed_not_started]

    AdminSandboxResetCloseNotStartedResult:
      type: object
      required: [requestId, appId, expectedEnvironment, operation, state, applied]
      additionalProperties: false
      properties:
        requestId: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }
        appId: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
        expectedEnvironment: { type: string, enum: [sandbox] }
        operation: { type: string, enum: [sandbox_reset] }
        state: { type: string, enum: [closed_not_started] }
        applied:
          type: boolean
          description: 최초 closure 생성이면 true, exact 멱등 재호출이면 false

    AdminGrantMutationResult:
      type: object
      required:
        [applied, entitlements, requestId, appId, platformUserId, entitlementId, expectedEnvironment, operation]
      additionalProperties: false
      properties:
        applied: { type: boolean }
        entitlements:
          type: array
          items: { $ref: '#/components/schemas/EntitlementId' }
        requestId: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }
        appId: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
        platformUserId: { type: string, pattern: '^pu_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
        entitlementId: { $ref: '#/components/schemas/EntitlementId' }
        expectedEnvironment: { $ref: '#/components/schemas/LedgerEnvironment' }
        operation: { type: string, enum: [grant] }

    AdminRevokeMutationResult:
      type: object
      required:
        [applied, entitlements, requestId, appId, platformUserId, entitlementId, expectedEnvironment, operation, grantRequestId]
      additionalProperties: false
      properties:
        applied: { type: boolean }
        entitlements:
          type: array
          items: { $ref: '#/components/schemas/EntitlementId' }
        requestId: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }
        appId: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
        platformUserId: { type: string, pattern: '^pu_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
        entitlementId: { $ref: '#/components/schemas/EntitlementId' }
        expectedEnvironment: { $ref: '#/components/schemas/LedgerEnvironment' }
        operation: { type: string, enum: [revoke] }
        grantRequestId: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }

  responses:
    BadRequest:
      description: 요청 형식 오류. 허용 필드 외 키가 있어도 여기로 온다
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    NotFound:
      description: 대상을 찾지 못함
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    Forbidden:
      description: 권한 부족, 앱 paused, anonymous 또는 관리 allowlist 불일치
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    Conflict:
      description: 다른 소유자의 구매이거나 replay 불일치
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    Unprocessable:
      description: 구매가 유효하지 않거나 상품 타입이 맞지 않음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    PayloadTooLarge:
      description: 본문 64KiB 초과
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    UnsupportedMediaType:
      description: Content-Type이 application/json이 아님
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    RateLimited:
      description: 한도 초과
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    ProviderError:
      description: 마켓 API 오류
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    ServiceUnavailable:
      description: 설정 오류이거나 일시적 처리 불가
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    SandboxResetConflict:
      description: |
        같은 requestId의 payload가 다르거나(`operator_replay_mismatch`), 같은 사용자의
        다른 reset intent가 이미 준비 상태이거나(`sandbox_reset_busy`), requestId가
        미시작으로 영구 종결됨(`sandbox_reset_closed`)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeError'
              - type: object
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code:
                        type: string
                        enum: [operator_replay_mismatch, sandbox_reset_busy, sandbox_reset_closed]
                      message: { type: string }
    SandboxResetResumeConflict:
      description: |
        요청 appId가 영구 reset target과 다르거나(`operator_replay_mismatch`),
        requestId가 미시작으로 영구 종결됨(`sandbox_reset_closed`)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeError'
              - type: object
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code:
                        type: string
                        enum: [operator_replay_mismatch, sandbox_reset_closed]
                      message: { type: string }
    SandboxResetCloseConflict:
      description: |
        같은 requestId의 closure payload가 다르거나 다른 운영 조작에 사용됨
        (`operator_replay_mismatch`), 또는 reset intent나 completion이 이미 확정됨
        (`sandbox_reset_already_started`)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeError'
              - type: object
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code:
                        type: string
                        enum: [operator_replay_mismatch, sandbox_reset_already_started]
                      message: { type: string }
    SandboxResetNotFound:
      description: |
        영구 reset intent와 미시작 closure가 모두 없음.
        `error.code`는 `sandbox_reset_not_found`
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeError'
              - type: object
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code:
                        type: string
                        enum: [sandbox_reset_not_found]
                      message: { type: string }
          example:
            ok: false
            error:
              code: sandbox_reset_not_found
              message: sandbox reset 요청을 찾을 수 없습니다
    SandboxResetPending:
      description: |
        영구 reset intent는 확정됐지만 효과 적용을 완료하지 못함.
        `error.code`는 `sandbox_reset_pending`이며 같은 requestId로만 재개해야 한다.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeError'
              - type: object
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code:
                        type: string
                        enum: [sandbox_reset_pending]
                      message: { type: string }
          example:
            ok: false
            error:
              code: sandbox_reset_pending
              message: sandbox reset 적용이 준비 상태입니다
    SandboxResetUnavailable:
      description: |
        intent 확정 전 설정·원장 오류이거나 intent 확정 뒤 효과 적용이 미완료됨.
        후자는 `error.code=sandbox_reset_pending`이며 같은 requestId로만 재개해야 한다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    InternalServerError:
      description: 원장 상태 오류 또는 예기치 않은 내부 실패
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    VerifyPurchaseOk:
      description: 검증 완료
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeOk'
              - type: object
                required: [result]
                properties:
                  result:
                    $ref: '#/components/schemas/VerifyPurchaseOutcome'
    AdminGrantMutationOk:
      description: 조작 완료 또는 동일 요청의 멱등 재호출
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeOk'
              - type: object
                required: [result]
                properties:
                  result:
                    $ref: '#/components/schemas/AdminGrantMutationResult'
    AdminRevokeMutationOk:
      description: 회수 완료 또는 동일 요청의 멱등 재호출
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeOk'
              - type: object
                required: [result]
                properties:
                  result:
                    $ref: '#/components/schemas/AdminRevokeMutationResult'
    AdminSandboxResetMutationOk:
      description: 초기화 완료, prepared 요청의 재개 완료 또는 completed 요청의 멱등 재호출
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeOk'
              - type: object
                required: [result]
                properties:
                  result:
                    $ref: '#/components/schemas/AdminSandboxResetMutationResult'
    AdminSandboxResetCloseNotStartedOk:
      description: 미시작 영구 종결 완료 또는 동일 요청의 멱등 재호출
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeOk'
              - type: object
                required: [result]
                properties:
                  result:
                    $ref: '#/components/schemas/AdminSandboxResetCloseNotStartedResult'

security:
  - PlatformToken: []
