<!doctype html><html><head><meta charset="utf-8"><title>Gzip HTTP fixture</title></head><body><canvas id="canvas" width="480" height="720"></canvas><pre id="report">Running synthetic local HTTP fixture...</pre><script src="engine/index.js"></script><script>
const variant = 'fixture';
window.fixtureSink={done(s){window.fixtureResult=JSON.parse(s);document.getElementById('report').textContent=JSON.stringify(window.fixtureResult,null,2);}};
const engine = new Engine({canvas:document.getElementById('canvas'),executable:'engine/index',mainPack:variant+'.pck',canvasResizePolicy:0,gdextensionLibs:[],persistentPaths:[]});
engine.startGame().catch(e=>{window.fixtureStartupError=String(e);document.getElementById('report').textContent=String(e);});
</script></body></html>
