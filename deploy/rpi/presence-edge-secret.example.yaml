# 예시만 커밋한다. 실제 Secret은 자격증명 catalog 원본에서 생성한다.
# 비공개키는 이 클러스터에 넣지 않고 Platform ingest에만 마운트한다.
apiVersion: v1
kind: Secret
metadata:
  name: presence-edge-secrets
  namespace: platform
type: Opaque
stringData:
  PRESENCE_DATABASE_URL: "mysql://platform_presence:CHANGEME@mysql.data.svc.cluster.local:3306/backoffice"
  # Ed25519 raw public key 32바이트의 표준 base64. 비밀값은 아니다.
  PRESENCE_PUBLIC_KEY: "CHANGEME_BASE64_PUBLIC_KEY"
